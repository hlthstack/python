      properties:
        provider_id: {type: [integer, string]}
        booking_id: {type: string}
        status: {type: string, enum: [confirmed]}
        payment_link: {type: string, format: uri}
        payment_link_expires_at: {type: string, format: date-time}
        customers:
          type: array
          items:
            type: object
            properties:
              customer_id: {type: string}
              name: {type: string}
              api_customer_id: {type: string}
              package_ids: {type: array, items: {type: [integer, string]}}
              appointment_id: {type: string}
              consultation_status: {type: string}
              customer_plan_id: {type: [integer, 'null']}
              subscription_id: {type: [string, 'null']}
    ConsultationDetails:
      type: object
      properties:
        booking_id: {type: string}
        appointment_id: {type: string}
        appointment_date_time: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/AppointmentStatus'}
        service_name: {type: string}
        service_mode: {type: string}
        api_customer_id: {type: [string, 'null']}
        customer_id: {type: string}
        doctor_id: {type: [string, 'null']}
        doctor_name: {type: [string, 'null']}
        doctor_specialities: {type: [array, 'null'], items: {type: string}}
        doctor_gender: {type: [string, 'null']}
        doctor_qualification: {type: [string, 'null']}
        doctor_languages: {type: [array, 'null'], items: {type: string}}
        doctor_experience: {type: integer}
        provider_id: {type: integer}
        is_priority_consultation: {type: boolean}
        is_default_provider: {type: boolean, description: "True while a priority consultation has no doctor assigned yet."}
        latitude: {type: [number, string, 'null'], description: "In-clinic only."}
        longitude: {type: [number, string, 'null'], description: "In-clinic only."}
        hospital_name: {type: [string, 'null'], description: "In-clinic only."}
        hospital_location: {type: [string, 'null'], description: "In-clinic only."}
        hospital_address: {type: [string, 'null'], description: "In-clinic only."}
        summary: {$ref: '#/components/schemas/FileLink'}
        prescriptions:
          type: array
          description: Online consultations only.
          items: {$ref: '#/components/schemas/FileLink'}
        meeting_link: {type: [string, 'null'], description: "Video consultations only."}

    # ---------- ePharmacy
    CustomerDetailsRef:
      type: object
      required: [api_customer_id]
      properties:
        api_customer_id: {type: string}
    MedicineSearchResponse:
      type: object
      properties:
        medicines:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              composition_with_strength: {type: [string, 'null']}
              manufacturer_name: {type: [string, 'null']}
              packing_label: {type: [string, 'null']}
              mrp: {type: [number, 'null']}
              available: {type: boolean}
              type: {type: [string, 'null']}
              rx_required: {type: boolean}
        meta:
          type: object
          properties:
            page: {type: integer}
    DigitizationAccepted:
      type: object
      properties:
        request_id: {type: string}
        digitization_id: {type: string}
        status: {type: string}
        message: {type: string}
    DigitizationStatus:
      type: object
      required: [request_id, status]
      properties:
        request_id: {type: string}
        status: {type: string, enum: [pending, ai_processing, manual_review, completed, partial, rejected, failed]}
        api_customer_id: {type: string}
        files:
          type: array
          items:
            type: object
            properties:
              url: {type: string, format: uri}
        message: {type: string}
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              medicine_id: {type: integer}
              name: {type: string}
              quantity: {type: integer}
        cart_id: {type: [integer, 'null']}
        error: {type: [string, 'null'], description: '`rejected` and `failed` only.'}
    CartProduct:
      type: object
      additionalProperties: true
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: [string, 'null']}
        quantity: {type: integer}
        mrp: {type: [string, number]}
        discount_price: {type: [number, 'null']}
        discount_percent: {type: [string, 'null']}
        rx_required: {type: boolean}
        is_available: {type: boolean}
        is_banned: {type: boolean}
        pack_size_label: {type: [string, 'null']}
        limit_per_order: {type: [integer, 'null']}
        min_limit_per_order: {type: [integer, 'null']}
        image: {type: [string, 'null']}
    Cart:
      type: object
      properties:
        id: {type: integer}
        api_customer_id: {type: string}
        plan_id: {type: [string, 'null']}
        products:
          type: array
          items: {$ref: '#/components/schemas/CartProduct'}
        prescription_ids: {type: array, items: {type: integer}}
        prescriptions:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              url: {type: string, description: "Pre-signed; expires after 5 minutes."}
              name: {type: string}
              status: {type: string}
        address_id: {type: [integer, 'null']}
        city: {type: [string, 'null']}
        zip_code: {type: [string, 'null']}
        coupon_code: {type: [string, 'null']}
        doctor_call_required: {type: [boolean, 'null']}
        fulfillment_type: {type: [string, 'null'], enum: [delivery, store_pickup, null]}
        selected_store_data: {type: object}
        eta: {}
    PharmacyAddressInput:
      type: object
      description: A new address. `pincode` (or its alias `zip_code`) is required as well as `line1`, `city` and `state`.
      required: [line1, city, state]
      properties:
        line1: {type: string, pattern: '\S'}
        line2: {type: string}
        city: {type: string, pattern: '\S'}
        state: {type: string, pattern: '\S'}
        pincode:
          type: [string, integer]
          pattern: '^[0-9]{6}$'
          minimum: 100000
          maximum: 999999
          description: 6-digit Indian pincode. Alias of zip_code; zip_code wins when both are sent.
        zip_code:
          type: [string, integer]
          pattern: '^[0-9]{6}$'
          minimum: 100000
          maximum: 999999
          description: 6-digit Indian pincode.
        country: {type: string, default: India}
        land_mark: {type: string}
        latitude: {type: number, description: "Optional; improves store-pickup ranking."}
        longitude: {type: number}
    UpdateCartRequest:
      type: object
      required: [customer_details]
      properties:
        plan_id: {type: string}
        customer_details:
          type: object
          required: [api_customer_id]
          properties:
            api_customer_id: {type: string, pattern: '\S'}
            name: {type: string}
            dob: {type: string, description: "A date; a value that is not a date is ignored."}
            mobile_number:
              type: string
              pattern: '^(?:[0-9]{10})?$'
              description: 10 digits without +91. An empty value is ignored.
            gender:
              type: string
              pattern: '^(?:[Mm][Aa][Ll][Ee]|[Ff][Ee][Mm][Aa][Ll][Ee]|[Nn][Oo][Nn]-[Bb][Ii][Nn][Aa][Rr][Yy])?$'
              description: '`male`, `female` or `non-binary`, any case.'
        products:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, quantity]
            properties:
              id: {type: integer, description: "Medicine id from `searchMedicines`."}
              quantity:
                type: integer
                minimum: 0
                description: 0 removes the line. A positive quantity must not exceed the medicine's `limit_per_order`.
        address: {$ref: '#/components/schemas/PharmacyAddressInput'}
        address_id: {type: integer, description: "Mutually exclusive with `address`."}
        fulfillment_type: {type: string, enum: [delivery, store_pickup]}
        selected_chemist_id: {type: string, description: "Store id; required for store_pickup."}
        medicine_vendor_id: {type: integer}
        prescription_urls:
          type: array
          maxItems: 5
          description: Public HTTPS URLs (port 443, no user info) to PDF/PNG/JPEG files under 7 MB.
          items:
            type: string
            format: uri
            pattern: '^https://[^/?#@:]+(?::443)?(?:[/?#]|$)'
        remove_prescription_ids:
          type: array
          minItems: 1
          items: {type: integer}
    FulfillmentOption:
      type: object
      additionalProperties: true
      properties:
        vendor_id: {type: integer, description: "Pass as `medicine_vendor_id`."}
        mrp: {type: number}
        selling_price: {type: number}
        additional_charges: {type: number}
        express_premium: {type: number}
        total_payable: {type: number}
        discount_price: {type: number}
        delivery_details: {type: object, additionalProperties: true}
        products: {type: array, items: {type: object, additionalProperties: true}}
        missing_products:
          type: array
          description: Items no pharmacy can supply for this mode.
          items: {type: object, additionalProperties: true}
        location_token: {type: string, description: "Pass to `createOrder` if the member picks this option."}
    FulfillmentOptions:
      type: object
      properties:
        success: {type: boolean}
        delivery_options:
          type: object
          properties:
            success: {type: boolean}
            location_not_servicable: {type: boolean}
            message: {type: string}
            express: {$ref: '#/components/schemas/FulfillmentOption'}
            standard: {$ref: '#/components/schemas/FulfillmentOption'}
        pickup_options:
          type: object
          additionalProperties: true
          properties:
            success: {type: boolean}
            starting_from: {type: number}
            vendors:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  success: {type: boolean}
                  vendor_id: {type: integer}
                  stores:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: {type: string, description: "Send as `selected_chemist_id`."}
                        name: {type: string}
                        address: {type: string}
                        latitude: {type: [string, number]}
                        longitude: {type: [string, number]}
                        display_eta: {type: string}
                        distance: {type: number}
                        location_token: {type: string}
    OrderPaymentDetailsRequest:
      type: object
      required: [customer_details, cart_id, selected_delivery_option]
      properties:
        plan_id: {type: string}
        customer_details: {$ref: '#/components/schemas/CustomerDetailsRef'}
        cart_id: {type: integer}
        selected_delivery_option: {type: string, enum: [express, standard, store_pickup]}
        selected_chemist_id: {type: string, description: "Required for store_pickup; must match the cart's store."}
        medicine_vendor_id: {type: integer, description: "The option's `vendor_id`."}
        customer_plan_id: {type: integer, minimum: 0}
        subscription_id: {type: string}
    OrderPaymentDetails:
      type: object
      properties:
        products:
          type: array
          items: {type: object, additionalProperties: true}
        payment_details:
          type: object
          properties:
            total_mrp: {type: number}
            sub_total: {type: number}
            discount: {type: number}
            shipping_charge: {type: number}
            free_shipping: {type: boolean}
            total_amount: {type: number, description: "Order value."}
            wallet_deduction: {type: number}
            spending_balance_deduction: {type: number}
            total_payable: {type: number, description: "What the member still owes."}
            partner_payment_required: {type: boolean, description: "Partner-collected flow only."}
            amount_to_collect: {type: number, description: "Partner-collected flow only."}
        estimated_time: {type: [string, 'null']}
        fulfillment: {type: object, additionalProperties: true}
        address: {type: object, additionalProperties: true}
    CreateOrderRequest:
      type: object
      required: [customer_details, cart_id]
      properties:
        plan_id: {type: string}
        customer_details: {$ref: '#/components/schemas/CustomerDetailsRef'}
        cart_id: {type: integer}
        delivery_option: {type: string, enum: [express, standard, store_pickup], default: standard}
        delivery_type: {type: string, enum: [delivery, pickup], description: "Defaults from the cart's fulfillment_type."}
        location_token: {type: string, description: "Token of the chosen option from `getFulfillmentOptions`."}
        medicine_vendor_id: {type: integer}
        coupon_code: {type: string}
        customer_plan_id: {type: integer, minimum: 0}
        subscription_id: {type: string}
    CreateOrderResponse:
      type: object
      required: [success, status, booking_id]
      properties:
        success: {type: boolean}
        status: {type: string, enum: [confirmed, payment_pending, partner_payment_pending]}
        booking_id: {type: integer}
        order_id: {type: string, description: "partner_payment_pending only."}
        payment_link: {type: string, format: uri, description: "payment_pending only."}
        amount_to_collect: {type: number, description: "partner_payment_pending only."}
        currency: {type: string}
        user_prescription_details: {$ref: '#/components/schemas/Order'}
    OrderFailure:
      type: object
      properties:
        success: {type: boolean, const: false}
        errors:
          type: object
          properties:
            msg: {type: string}
            recall: {type: boolean}
    ConfirmOrderError:
      type: object
      properties:
        success: {type: boolean, const: false}
        status: {type: string, enum: [transaction_locked, invalid_payment]}
        errors:
          anyOf:
            - type: array
              items: {type: string}
            - type: object
              properties:
                base: {type: string}
    PharmacyOrderStatus:
      type: string
      description: |
        Order status. Match on this, not on `status_text`. Known values: `received`,
        `abandoned`, `failed`, `consultation_required`, `prescription_under_verification`,
        `verification_pending`, `onhold`, `verified`, `prescription_rejected`,
        `prescription_cancelled`, `ops_rejected`, `created`, `in_progress`, `processed`,
        `packing`, `packed`, `invoice_generated`, `in_transit`, `in_delivery`,
        `out_for_delivery`, `delivery_postponed`, `delivered`, `cancellation_request`,
        `cancellation_inprogress`, `cancelled`, `rejected`, `out_of_stock`, `returned`,
        `returned_and_refunded`. New values may be added.
    OrderItem:
      type: object
      additionalProperties: true
      properties:
        id: {type: [integer, string]}
        product_id: {type: [string, 'null']}
        name: {type: string}
        quantity: {type: integer}
        mrp: {type: number}
        offered_price: {type: number}
        selling_price: {type: number}
        discounted_price: {type: number}
    Order:
      type: object
      additionalProperties: true
      properties:
        unique_id: {type: string}
        status: {$ref: '#/components/schemas/PharmacyOrderStatus'}
        status_text: {type: [string, 'null']}
        status_description: {type: [string, 'null']}
        partner_status: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        otp: {type: [string, 'null']}
        vendor_name: {type: [string, 'null']}
        order_type: {type: [string, 'null']}
        api_customer_id: {type: [string, 'null']}
        tracking_number: {type: [string, 'null']}
        tracking_url: {type: [string, 'null']}
        tracking_partner: {type: [string, 'null']}
        eta_from: {type: [string, 'null']}
        eta_to: {type: [string, 'null']}
        invoice_url: {type: [string, 'null']}
        payment_details: {type: object, additionalProperties: true}
        products: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        address: {type: object, additionalProperties: true}
        prescriptions: {type: array, items: {type: string}}
        split_details: {$ref: '#/components/schemas/SplitDetails'}
    SplitDetails:
      type: [object, 'null']
      properties:
        is_splitted: {type: boolean}
        parent_order: {}
        sub_orders:
          type: array
          items: {type: object, additionalProperties: true}
    ShipmentDetails:
      type: object
      properties:
        delivery_type: {type: [string, 'null'], enum: [store_pickup, express, standard, null]}
        otp: {type: [string, 'null']}
        tracking_partner: {type: [string, 'null']}
        tracking_number: {type: [string, 'null']}
        tracking_url: {type: [string, 'null']}
        eta_from: {type: [string, 'null']}
        eta_to: {type: [string, 'null']}
        store_details: {type: [object, 'null']}
    PharmacyPayment:
      type: object
      additionalProperties: true
      properties:
        status: {type: string}
        razorpay_amount: {type: number}
        razorpay_payment_id: {type: [string, 'null']}
        razorpay_order_id: {type: [string, 'null']}
        sponsor_wallet_amount: {type: number}
        customer_wallet_amount: {type: number}
        promotional_wallet_amount: {type: number}
        h_points_amount: {type: number}
        refunded_amount: {type: number}
        total_collected_amount: {type: number}
        captured_at: {type: [string, 'null']}
        refunded_at: {type: [string, 'null']}
        partner_collected: {type: boolean}
        partner_collected_amount: {type: number}
        additional_collected_amount: {type: number}
        partner_payment_reference: {type: [string, 'null']}
    PharmacyOrderWebhook:
      type: object
      properties:
        type: {type: string, enum: [status_update, post_billing, additional_payment_required], description: "status_update here; post_billing and additional_payment_required extend this payload."}
        order_id: {type: string}
        customer_id: {type: string}
        api_customer_id: {type: [string, 'null']}
        member_id: {type: [string, 'null']}
        ordered_for_name: {type: [string, 'null']}
        mobile_number: {type: [string, 'null']}
        order_type: {type: [string, 'null']}
        vendor_name: {type: [string, 'null']}
        service_type: {type: string, const: pharmacy}
        plan_id: {type: [string, 'null']}
        customer_plan_id: {type: [integer, 'null']}
        subscription_id: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/PharmacyOrderStatus'}
        status_text: {type: [string, 'null']}
        status_description: {type: [string, 'null']}
        partner_status: {type: [string, 'null']}
        order_items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        total_amount: {type: number}
        total_selling_price: {type: number}
        total_discount: {type: number}
        sub_total: {type: number, description: "Partner-collected only."}
        additional_charge: {type: number, description: "Partner-collected only."}
        total_payable: {type: number, description: "Partner-collected only."}
        tracking_url: {type: [string, 'null']}
        tracking_partner: {type: [string, 'null']}
        tracking_number: {type: [string, 'null']}
        eta_from: {type: [string, 'null']}
        eta_to: {type: [string, 'null']}
        shipment_details: {$ref: '#/components/schemas/ShipmentDetails'}
        address: {type: string, description: "Present when the order has an address."}
        city: {type: string}
        pincode: {type: string}
        state: {type: string}
        split_details: {$ref: '#/components/schemas/SplitDetails'}
        payment: {$ref: '#/components/schemas/PharmacyPayment'}
      example:
        type: status_update
        order_id: EPO000000000001
        customer_id: EKI000000001
        api_customer_id: CUST1001
        ordered_for_name: Jane Doe
        mobile_number: '9999999999'
        order_type: cart_order
        vendor_name: Example Pharmacy
        service_type: pharmacy
        plan_id: EXAMPLE_PLAN
        status: out_for_delivery
        status_text: Order out for delivery
        order_items:
          - {id: 50001, product_id: SKU-1, name: Example 500 Tablet, quantity: 2, mrp: 50.0, offered_price: 45.0}
        total_amount: 95.0
        total_selling_price: 90.0
        total_discount: 5.0
        shipment_details: {delivery_type: standard, otp: '1234', tracking_partner: Example Courier, tracking_number: TRK1, tracking_url: 'https://track.example.com/TRK1', eta_from: null, eta_to: null, store_details: null}
        address: 1 Example Road, Motera, Ahmedabad, Gujarat, 380005
        city: Ahmedabad
        pincode: '380005'
        state: Gujarat
        split_details: {is_splitted: false, parent_order: null, sub_orders: []}
    PharmacyPostBillingWebhook:
      allOf:
        - $ref: '#/components/schemas/PharmacyOrderWebhook'
        - type: object
          properties:
            type: {type: string, const: post_billing}
            settlement:
              type: object
              properties:
                original_collected_amount: {type: number}
                additional_collected_amount: {type: number}
                total_collected_amount: {type: number}
                final_amount: {type: number, description: "Authoritative delivered value."}
                adjustment_amount: {type: number, description: "total_collected_amount - final_amount; refund this to the member."}
                settled_at: {type: string, format: date-time}
                orders:
                  type: array
                  items:
                    type: object
                    properties:
                      order_id: {type: string}
                      status: {type: string}
                      selling_price: {type: number}
    PharmacyAdditionalPaymentWebhook:
      allOf:
        - $ref: '#/components/schemas/PharmacyOrderWebhook'
        - type: object
          properties:
            type: {type: string, const: additional_payment_required}
            additional_payment:
              type: object
              properties:
                order_id: {type: string, description: "The pharmacy's order reference (may be a split child)."}
                amount_payable: {type: number, description: "Amount to collect for that order."}
                partner_collected_amount: {type: number}
                additional_collected_amount: {type: number, description: "Running total across the order tree."}
                signalled_at: {type: string, format: date-time}
    PrescriptionDigitizedWebhook:
      type: object
      properties:
        type: {type: string, const: digitization_results}
        event_type: {type: string, const: pharmacy.prescription.digitized}
        request_id: {type: string}
        status: {type: string, enum: [completed, partial, rejected, failed]}
        customer_id: {type: string}
        api_customer_id: {type: [string, 'null']}
        member_id: {type: [string, 'null']}
        plan_id: {type: [string, 'null']}
        items: {type: [array, 'null'], items: {type: object, additionalProperties: true}}
        reviewed_items: {type: [array, 'null'], items: {type: object, additionalProperties: true}}
        cart_id: {type: [integer, 'null']}
        documents:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              url: {type: string}
              type: {type: string, enum: [pdf, image]}
              name: {type: string}
        comment: {type: [string, 'null']}

    # ---------- wallet
    WalletBenefit:
      type: object
      properties:
        benefit_type: {type: string}
        allocated_benefit_amount: {type: number}
        available_benefit_amount: {type: number, minimum: 0}
        allocated_benefit_utilization_count: {type: integer}
        current_benefit_utilization_count: {type: integer}
    WalletResponse:
      type: object
      properties:
        status: {type: string, const: success}
        data:
          type: object
          properties:
            customer_plan_id: {type: integer, description: "Present when a subscription was named."}
            subscription_id: {type: [string, 'null']}
            members:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  gender: {type: [string, 'null']}
                  dob: {type: [string, 'null'], format: date}
                  phone: {type: [string, 'null']}
                  email: {type: [string, 'null']}
                  relationship: {type: string, description: "Uppercase, e.g. SELF, SPOUSE."}
                  relation: {type: string, description: "Lowercase, e.g. self, spouse."}
                  member_status: {type: string, enum: [ACTIVE, INACTIVE]}
                  wallet_details:
                    type: object
                    properties:
                      benefits: {type: array, items: {$ref: '#/components/schemas/WalletBenefit'}}
                      total_allocated_amount: {type: number}
                      available_amount: {type: number}
    CustomerPlansResponse:
      type: object
      properties:
        status: {type: string, const: success}
        data:
          type: object
          properties:
            customer_plans:
              type: array
              items:
                type: object
                properties:
                  customer_plan_id: {type: integer}
                  subscription_id: {type: [string, 'null']}
                  plan_id: {type: string}
                  plan_name: {type: string}
                  start_date: {type: string, format: date}
                  end_date: {type: [string, 'null'], format: date}
                  grace_end_date: {type: [string, 'null'], format: date}
                  status: {type: string, enum: [active, upcoming, grace]}
                  available_balance: {type: number}

    # ---------- pre-registration
    PreRegistrationAccessToken:
      type: object
      required: [access_token, expires_at]
      properties:
        access_token: {type: string}
        expires_at:
          type: string
          description: UTC, formatted `YYYY-MM-DD HH:MM:SS UTC` (not ISO 8601).
          example: '2026-01-15 07:16:21 UTC'
    PreRegistrationAccepted:
      type: object
      required: [message, request_id]
      properties:
        message: {type: string, example: Request has been accepted}
        request_id: {type: string, format: uuid}
    VoluntaryPlanEntry:
      description: |
        A plan id shared at onboarding, or an object naming one subscription. Without
        `additional: true`, a subscription the member already holds on the plan is reused.
      oneOf:
        - type: string
          example: EXAMPLE_TOPUP
        - type: object
          required: [plan_id]
          properties:
            plan_id: {type: string}
            start_date:
              type: string
              description: '`DD-MM-YYYY` or `YYYY-MM-DD`. Defaults to today; must not be after the plan''s end date.'
            additional:
              description: |
                Add another subscription to the plan, up to the plan's subscription limit. Counts
                only with `subscription_id`. `true` or `false`; the strings `true`, `false`, `1`
                and `0` (any case) and the integers 1 and 0 are also accepted.
              anyOf:
                - type: boolean
                - type: string
                  pattern: '^\s*(?:[Tt][Rr][Uu][Ee]|[Ff][Aa][Ll][Ss][Ee]|1|0)\s*$'
                - type: integer
                  enum: [0, 1]
            subscription_id:
              type: string
              description: Your own order id. Resending it returns the subscription it created, so retries never duplicate.
    PreRegistrationEmployee:
      type: object
      description: |
        One member (employee). Every key in `required` must be present, even with an empty
        value; a row missing one is dropped without being reported. Identify the employee by
        `email`, or by `employee_code` within `company_id`. Blank values (`""`, `null`) pass
        the format checks below except where a value is required.
      required: [company_id, employee_code, first_name, last_name, date_of_birth, gender, mobile_number, vip, entity_name, employee_office_location, department, grade, date_of_joining]
      properties:
        company_id:
          type: [string, integer]
          description: The company (or entity) the member belongs to, shared at onboarding. Must be one your credentials can act on.
        employee_code:
          type: [string, 'null']
          description: Required (non-empty) when there is no `email`. Unique within the company.
        email:
          type: [string, 'null']
          pattern: '^\s*$|\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,9}\b'
          description: Required when `employee_code` is empty. Unique.
        first_name:
          type: string
          pattern: '^[a-zA-Z\s]*[a-zA-Z][a-zA-Z\s]*$'
          description: Letters and spaces only; at least one letter.
        last_name:
          type: [string, 'null']
          pattern: '^[a-zA-Z\s]*$'
          description: Letters and spaces only.
        date_of_birth:
          type: [string, 'null']
          pattern: '^\s*$|^\s*(?:0[1-9]|1[0-9]|2[0-9]|3[01])-(?:0[1-9]|1[012])-(?:19|20)[0-9]{2}|(?:0[1-9]|1[0-9]|2[0-9]|3[01])/(?:0[1-9]|1[012])/(?:19|20)[0-9]{2}\s*$'
          description: '`DD-MM-YYYY` or `DD/MM/YYYY` (years 1900-2099), not in the future.'
        gender:
          type: [string, 'null']
          pattern: '^\s*(?:(?:[Mm][Aa][Ll][Ee]|[Ff][Ee][Mm][Aa][Ll][Ee]|[Nn][Oo][Nn]-[Bb][Ii][Nn][Aa][Rr][Yy])\s*)?$'
          description: '`Male`, `Female` or `Non-binary` (any case).'
        mobile_number:
          type: [string, 'null']
          pattern: '^\s*$|^[0-9]{10}$'
          description: 10-digit mobile number without the country code.
        vip:
          type: [string, 'null']
          pattern: '^\s*(?:(?:[Yy][Ee][Ss]|[Nn][Oo])\s*)?$'
          description: '`Yes` or `No` (any case).'
        entity_name: {type: [string, 'null']}
        employee_office_location: {type: [string, 'null']}
        department: {type: [string, 'null']}
        grade: {type: [string, 'null']}
        date_of_joining:
          type: [string, 'null']
          pattern: '^\s*$|^(?:0[1-9]|1[0-9]|2[0-9]|3[01])-(?:0[1-9]|1[012])-(?:19|20)[0-9]{2}|(?:0[1-9]|1[0-9]|2[0-9]|3[01])/(?:0[1-9]|1[012])/(?:19|20)[0-9]{2}$'
          description: '`DD-MM-YYYY` or `DD/MM/YYYY` (years 1900-2099).'
        api_customer_id: {type: [string, 'null'], description: Your id for the member.}
        voluntary_plan_ids:
          type: array
          items: {$ref: '#/components/schemas/VoluntaryPlanEntry'}
    PreRegistrationDependant:
      type: object
      description: |
        One dependant. Every key in `required` must be present, even with an empty value; a
        row missing one is dropped without being reported. Link it to its employee with
        `guardian_email`, or with `company_id` plus `guardian_employee_code`.
        `voluntary_plan_ids` is not accepted on dependants: the dependant is registered but
        the row is reported as failed. Blank values (`""`, `null`) pass the format checks
        below except where a value is required.
      required: [first_name, last_name, date_of_birth, gender, mobile_number, relation]
      properties:
        guardian_email:
          type: [string, 'null']
          pattern: '^\s*$|\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,9}\b'
          description: The employee's email.
        company_id: {type: [string, integer, 'null'], description: The employee's company. Used with `guardian_employee_code`.}
        guardian_employee_code: {type: [string, 'null'], description: The employee's `employee_code`. Used with `company_id` when the employee has no email.}
        dependent_code: {type: [string, 'null'], description: 'Your id for the dependant. Unique per employee, case-insensitive.'}
        email:
          type: [string, 'null']
          pattern: '^\s*$|\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,9}\b'
        first_name:
          type: string
          pattern: '^[a-zA-Z\s]*[a-zA-Z][a-zA-Z\s]*$'
          description: Letters and spaces only; at least one letter.
        last_name:
          type: [string, 'null']
          pattern: '^[a-zA-Z\s]*$'
          description: Letters and spaces only.
        date_of_birth:
          type: [string, 'null']
          pattern: '^\s*$|^\s*(?:0[1-9]|1[0-9]|2[0-9]|3[01])-(?:0[1-9]|1[012])-(?:19|20)[0-9]{2}|(?:0[1-9]|1[0-9]|2[0-9]|3[01])/(?:0[1-9]|1[012])/(?:19|20)[0-9]{2}\s*$'
          description: '`DD-MM-YYYY` or `DD/MM/YYYY` (years 1900-2099), not in the future.'
        gender:
          type: [string, 'null']
          pattern: '^\s*(?:(?:[Mm][Aa][Ll][Ee]|[Ff][Ee][Mm][Aa][Ll][Ee])\s*)?$'
          description: '`Male` or `Female` (any case).'
        mobile_number:
          type: [string, 'null']
          pattern: '^\s*(?:[0-9]{10}\s*)?$'
          description: 10-digit mobile number without the country code.
        relation:
          type: [string, 'null']
          pattern: '^\s*(?:(?:[Ff][Aa][Tt][Hh][Ee][Rr][ _][Ii][Nn][ _][Ll][Aa][Ww]|[Mm][Oo][Tt][Hh][Ee][Rr][ _][Ii][Nn][ _][Ll][Aa][Ww]|[Ff][Aa][Tt][Hh][Ee][Rr]|[Mm][Oo][Tt][Hh][Ee][Rr]|[Bb][Rr][Oo][Tt][Hh][Ee][Rr]|[Ss][Ii][Ss][Tt][Ee][Rr]|[Hh][Uu][Ss][Bb][Aa][Nn][Dd]|[Ww][Ii][Ff][Ee]|[Ss][Oo][Nn]|[Dd][Aa][Uu][Gg][Hh][Tt][Ee][Rr])\s*)?$'
          description: 'One of `Father`, `Mother`, `Brother`, `Sister`, `Husband`, `Wife`, `Son`, `Daughter`, `Father in law`, `Mother in law` (any case; `_` may separate words).'
        api_customer_id: {type: [string, 'null'], description: Your id for the dependant.}
        authorised_dependent: {type: [string, 'null'], description: '`Yes` or `No`. Defaults to `Yes`; any value other than `yes` (any case) means `No`.'}
    PreRegistrationEmployeeUpdate:
      type: object
      description: |
        Identify the employee by `email`, or by `company_id` plus `employee_code`; send only
        the fields to change. `email` can't be changed. `mobile_number` is stored as the
        alternate mobile number.
      properties:
        email: {type: string}
        company_id: {type: [string, integer]}
        employee_code: {type: [string, 'null']}
        first_name: {type: string}
        last_name: {type: [string, 'null']}
        date_of_birth: {type: [string, 'null']}
        gender:
          type: [string, 'null']
          pattern: '^(?:[Mm][Aa][Ll][Ee]|[Ff][Ee][Mm][Aa][Ll][Ee]|[Nn][Oo][Nn]-[Bb][Ii][Nn][Aa][Rr][Yy])?$'
          description: '`Male`, `Female` or `Non-binary` (any case, no surrounding spaces).'
        mobile_number:
          type: [string, 'null']
          pattern: '^\s*$|^[0-9]{10}$'
          description: 10-digit mobile number without the country code.
        vip: {type: [string, 'null'], description: '`Yes` or `No`; any value other than `yes` (any case) means `No`.'}
        entity_name: {type: [string, 'null']}
        employee_office_location: {type: [string, 'null']}
        department: {type: [string, 'null']}
        grade: {type: [string, 'null'], description: Must be one of the company's grades.}
        date_of_joining: {type: [string, 'null']}
        api_customer_id: {type: [string, 'null']}
        voluntary_plan_ids:
          type: array
          items: {$ref: '#/components/schemas/VoluntaryPlanEntry'}
    PreRegistrationDependantUpdate:
      type: object
      description: |
        Identify the dependant by `api_customer_id` or `dependent_code` (with the employee's
        `guardian_email`, or `company_id` plus `guardian_employee_code`), or by
        `mobile_number`. Send only the fields to change. Sending `dependent_code` on a
        dependant found another way sets its code; an empty one never clears it.
      properties:
        guardian_email: {type: string}
        company_id: {type: [string, integer]}
        guardian_employee_code: {type: string}
        api_customer_id: {type: string}
        dependent_code: {type: string}
        mobile_number:
          type: string
          pattern: '^\s*$|^[0-9]{10}$'
          description: 10-digit mobile number without the country code. Used to find the dependant, and stored as the alternate mobile number.
        first_name: {type: string}
        last_name: {type: [string, 'null']}
        email: {type: [string, 'null']}
        date_of_birth: {type: [string, 'null']}
        gender:
          type: [string, 'null']
          pattern: '^(?:[Mm][Aa][Ll][Ee]|[Ff][Ee][Mm][Aa][Ll][Ee]|[Nn][Oo][Nn]-[Bb][Ii][Nn][Aa][Rr][Yy])?$'
          description: '`Male`, `Female` or `Non-binary` (any case, no surrounding spaces).'
        relation: {type: string}
        authorised_dependent: {type: string, description: '`Yes` or `No`.'}
    CreatePreRegistrationsRequest:
      type: object
      description: At most 250 rows in `employees` and `dependants` together.
      properties:
        employees:
          type: array
          items: {$ref: '#/components/schemas/PreRegistrationEmployee'}
        dependants:
          type: array
          items: {$ref: '#/components/schemas/PreRegistrationDependant'}
    UpdatePreRegistrationsRequest:
      type: object
      description: At most 250 rows in `employees` and `dependants` together.
      properties:
        employees:
          type: array
          items: {$ref: '#/components/schemas/PreRegistrationEmployeeUpdate'}
        dependants:
          type: array
          items: {$ref: '#/components/schemas/PreRegistrationDependantUpdate'}
    DeactivatePreRegistrationsRequest:
      type: object
      description: At most 250 entries in `employees` and `dependants` together.
      properties:
        employees:
          type: array
          description: Emails of the employees to deactivate.
          items: {type: string}
        dependants:
          type: array
          description: Mobile numbers of the dependants to deactivate.
          items: {type: string}
    PreRegistrationSuccessRecord:
      type: object
      properties:
        employee_code: {type: [string, 'null'], description: "The employee code, or a dependant's `dependent_code`."}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        email: {type: [string, 'null']}
        date_of_birth: {type: [string, 'null'], format: date}
        gender: {type: [string, 'null']}
        mobile_number: {type: [string, 'null']}
        vip: {type: string, enum: ['Yes', 'No']}
        entity_name: {type: [string, 'null']}
        employee_office_location: {type: [string, 'null']}
        department: {type: [string, 'null']}
        customer_token: {type: [string, 'null'], description: hlthstack's token for the member.}
        errors: {type: array, items: {type: string}}
        grade: {type: [string, 'null']}
        guardian_email: {type: [string, 'null'], description: Dependants only.}
        relation: {type: [string, 'null'], description: Dependants only.}
        customer_plans:
          type: array
          description: Create and update requests only. The member's active, upcoming and grace-period subscriptions.
          items:
            type: object
            properties:
              customer_plan_id: {type: integer}
              subscription_id: {type: [string, 'null']}
              plan_id: {type: [string, 'null']}
              plan_name: {type: [string, 'null']}
              start_date: {type: string, format: date}
              end_date: {type: string, format: date}
              grace_end_date: {type: string, format: date}
              status: {type: string, enum: [active, upcoming, grace]}
        status: {type: string, enum: [Active, Inactive], description: Deactivate requests only.}
    PreRegistrationFailureRecord:
      type: object
      description: |
        Create and update requests echo the row's fields with `errors`. Deactivate requests
        return `errors` only.
      required: [errors]
      properties:
        employee_code: {type: [string, 'null']}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        email: {type: [string, 'null']}
        date_of_birth: {type: [string, 'null']}
        gender: {type: [string, 'null']}
        mobile_number: {type: [string, 'null']}
        vip: {type: [string, 'null']}
        entity_name: {type: [string, 'null']}
        employee_office_location: {type: [string, 'null']}
        department: {type: [string, 'null']}
        guardian_email: {type: [string, 'null']}
        errors: {type: array, items: {type: string}}
    PreRegistrationStatus:
      type: object
      required: [request_id, status, success_records, failure_records, created_at]
      properties:
        request_id: {type: string, format: uuid}
        status:
          type: string
          enum: [initialized, scheduled, inprogress, completed, failed]
          description: Rows are processed while `inprogress`; results are final at `completed`.
        success_records:
          type: array
          items: {$ref: '#/components/schemas/PreRegistrationSuccessRecord'}
        failure_records:
          type: array
          items: {$ref: '#/components/schemas/PreRegistrationFailureRecord'}
        created_at: {type: string, format: date-time}
