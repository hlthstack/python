        '403':
          $ref: '#/components/responses/NotYourAppointment'

  /api/consultations/{appointment_id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    patch:
      operationId: rescheduleConsultation
      tags: [Consultations]
      summary: Reschedule a consultation
      description: |
        Moves the consultation to a new slot with the same doctor (to change doctor, cancel
        and book again). Allowed up to 30 minutes before the current slot, and not within
        5 minutes of the previous booking or reschedule.
      x-hlthstack-rules:
        - rule: relative_date
          description: appointment_date_time must be later than now (a time without an offset is read as IST).
          fields: [appointment_date_time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_date_time]
              properties:
                appointment_date_time:
                  type: string
                  format: date-time
                  description: New slot (`utc_slot_time` from `listSlots`).
                provider_id:
                  type: [integer, string]
                  description: Optional. If sent, must be the consultation's current provider.
            example: {appointment_date_time: '2030-01-16T04:30:00.000Z'}
      responses:
        '200':
          description: Rescheduled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: Appointment rescheduled successfully}
        '400':
          description: Not allowed, or the slot is unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
              examples:
                rule:
                  value: {errors: {reschedule_error: ['Rescheduling is not allowed: The appointment time must be at least 30 minutes from now.']}}
                slot:
                  value: {errors: {messages: ['Selected slot is unavailable, please select different slot']}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'
        '422':
          description: Blocked by the reschedule policy (status, plan, timing).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [Please wait 3 minute(s) before you reschedule this appointment.]}}

  /api/consultations/{appointment_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    patch:
      operationId: cancelConsultation
      tags: [Consultations]
      summary: Cancel a consultation
      description: Allowed up to 30 minutes before the slot, and not after a no-show or rejection.
      responses:
        '200':
          description: Cancelled. Note the key is `msg`.
          content:
            application/json:
              schema:
                type: object
                required: [msg]
                properties:
                  msg: {type: string}
              example: {msg: Appointment cancelled}
        '400':
          description: Cancellation not allowed.
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: object
                    properties:
                      cancel_error:
                        type: array
                        items: {type: string}
              example: {errors: {cancel_error: ['Cancellation not allowed: The appointment time must be at least 30 minutes from now.']}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'
        '422':
          $ref: '#/components/responses/UnprocessableMessages'

  /api/consultations/{appointment_id}/summary_and_prescription:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    get:
      operationId: getConsultationSummaryAndPrescription
      tags: [Consultations]
      summary: Get the consultation summary and prescriptions
      description: File links are pre-signed and expire after a few minutes; fetch them when needed.
      responses:
        '200':
          description: Summary and prescriptions.
          content:
            application/json:
              schema:
                type: object
                required: [summary, doctor_prescriptions]
                properties:
                  summary: {$ref: '#/components/schemas/FileLink'}
                  doctor_prescriptions:
                    type: array
                    items: {$ref: '#/components/schemas/FileLink'}
              example:
                summary: {file_name: summary.pdf, file_url: 'https://files.example.com/summary.pdf'}
                doctor_prescriptions:
                  - {file_name: prescription.pdf, file_url: 'https://files.example.com/prescription.pdf'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'
        '404':
          description: No consultation record yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [Consultation not found]}}

  /api/consultations/{appointment_id}/voucher:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    get:
      operationId: getConsultationVoucher
      tags: [Consultations]
      summary: Download an in-clinic consultation voucher
      description: Returns the voucher PDF for a confirmed in-clinic consultation.
      responses:
        '200':
          description: Voucher PDF.
          content:
            application/pdf:
              schema: {type: string, contentMediaType: application/pdf}
        '400':
          description: Not confirmed, or not in-clinic.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [voucher only available for download when appointment is confirmed and inclinic]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'

  /api/consultations/{appointment_id}/upload_documents:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    post:
      operationId: uploadConsultationDocuments
      tags: [Consultations]
      summary: Upload medical documents for a consultation
      description: |
        Shares the member's reports with the doctor (online specialist and priority
        consultations). Multipart form with one or more `files[][name]` + `files[][value]`
        pairs, each with a non-blank name and a file. Allowed types: PDF, JPEG, PNG
        (password-protected PDFs are refused).
      x-hlthstack-rules:
        - rule: item_count
          description: At least one file; every file entry needs both a non-blank name and a value.
          fields: ['files[][name]', 'files[][value]']
        - rule: file_limits
          description: Each file must be PDF, JPEG or PNG (extension pdf, jpg, jpeg or png) and not password-protected.
          fields: ['files[][value]']
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ['files[][name]', 'files[][value]']
              properties:
                'files[][name]':
                  type: string
                  pattern: '\S'
                  description: Title of the document. Repeat once per file, in the same order as `files[][value]`.
                'files[][value]':
                  type: string
                  contentMediaType: application/octet-stream
                  description: The file.
      responses:
        '200':
          description: Uploaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: Document uploaded successfully}
        '400':
          description: Bad form data or file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {}
              examples:
                format:
                  value: {message: Invalid file format}
                empty:
                  value: {message: No files found}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'

  /api/consultations/{appointment_id}/update_status:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    patch:
      operationId: simulateConsultationStatus
      tags: [Testing]
      summary: (Staging only) Move a consultation to a new status
      description: |
        **Staging only**; the route does not exist in production (404). Fires the same
        webhook as a real update. `reports_received` attaches a sample summary and
        prescription and then moves the consultation to `received`.
      servers:
        - url: https://staging-api.hlthstack.io
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirm, cancel, completed, reschedule, reports_received]
                reschedule_time:
                  type: string
                  format: date-time
                  description: For `reschedule`. Defaults to 1 day from now.
            example: {status: confirm}
      responses:
        '200':
          description: Status changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Messages'}
              example: {messages: [Appointment status updated successfully]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid status or transition.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorList'
                  - $ref: '#/components/schemas/ErrorMessages'
              examples:
                invalid:
                  value: {errors: [Invalid status]}
                transition:
                  value: {errors: {messages: ["Event 'confirm' cannot transition from 'confirmed'."]}}

  # ---------------------------------------------------------------- ePharmacy
  /api/epharmacy/medicines/search:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    get:
      operationId: searchMedicines
      tags: [ePharmacy]
      summary: Search medicines
      description: |
        Searches the catalogue. The returned `id` is the only medicine id the cart accepts.
        `rx_required: true` means a prescription must be attached before ordering.
      parameters:
        - name: name
          in: query
          required: true
          description: Search text, at least 3 characters after trimming surrounding whitespace.
          schema: {type: string, minLength: 3, pattern: '\S[\s\S]+\S'}
          example: paracetamol
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        '200':
          description: Matches.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MedicineSearchResponse'}
              example:
                medicines:
                  - id: 50001
                    name: Example 500 Tablet
                    composition_with_strength: Paracetamol (500mg)
                    manufacturer_name: Example Pharma Ltd
                    packing_label: strip of 10 tablets
                    mrp: 25.0
                    available: true
                    type: allopathy
                    rx_required: false
                meta: {page: 1}
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldErrors'}
              example: {errors: {name: [must be at least 3 characters]}}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/prescriptions/digitize:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    post:
      operationId: digitizePrescription
      tags: [ePharmacy]
      summary: Upload a prescription for digitization
      description: |
        Upload a prescription; hlthstack extracts the medicines and, when done, builds a
        cart for the member. Poll `getPrescriptionDigitization` or wait for the
        `prescriptionDigitized` webhook.

        `customers` is an array with exactly one customer. Send an `Idempotency-Key` to make
        retries safe: repeating a key returns the existing request.
      x-hlthstack-rules:
        - rule: item_count
          description: customers must contain exactly one customer.
          fields: [customers]
        - rule: item_count
          description: files[] must contain at least one file.
          fields: ['files[]']
        - rule: file_limits
          description: Each file at most 10 MB, with content type image/jpeg, image/png or application/pdf.
          fields: ['files[]']
        - rule: relative_date
          description: dob must not be after today.
          fields: ['customers[][dob]']
      parameters:
        - name: Idempotency-Key
          in: header
          description: Optional. A unique key per upload; a repeat returns the original request.
          schema: {type: string}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ['customers[][name]', 'customers[][api_customer_id]', 'customers[][mobile_number]', 'customers[][gender]', 'customers[][dob]', 'files[]']
              properties:
                'customers[][name]': {type: string, pattern: '\S'}
                'customers[][api_customer_id]': {type: string, pattern: '^[a-zA-Z0-9]+$'}
                'customers[][mobile_number]': {type: string, pattern: '^[0-9]{10}$'}
                'customers[][gender]': {type: string, enum: [male, female, non-binary]}
                'customers[][dob]': {type: string, format: date}
                plan_id: {type: string}
                'files[]':
                  type: array
                  minItems: 1
                  description: JPEG, PNG or PDF; each up to 10 MB.
                  items: {type: string, contentMediaType: application/octet-stream}
      responses:
        '202':
          description: Accepted (or already received for this Idempotency-Key).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DigitizationAccepted'}
              example:
                request_id: DIGI_RQ_A1B2C3D4E
                digitization_id: DIGI_RQ_A1B2C3D4E
                status: pending
                message: Prescription uploaded successfully. You will receive a webhook once digitization is complete.
        '400':
          description: Invalid customer or files.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldErrors'}
              example: {errors: {customers: [must contain exactly one customer]}}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/prescriptions/digitize/{request_id}:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - name: request_id
        in: path
        required: true
        schema: {type: string}
        example: DIGI_RQ_A1B2C3D4E
    get:
      operationId: getPrescriptionDigitization
      tags: [ePharmacy]
      summary: Get digitization status
      description: |
        Statuses: `pending` -> `ai_processing` -> `manual_review` -> `completed` | `partial` |
        `rejected` | `failed`. On `completed`/`partial` the response has the extracted `items`
        and a ready `cart_id`. File URLs are pre-signed and expire after 5 minutes.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DigitizationStatus'}
              example:
                request_id: DIGI_RQ_A1B2C3D4E
                status: completed
                api_customer_id: CUST1001
                files: [{url: 'https://files.example.com/prescription.pdf'}]
                message: Prescription digitization is completed.
                items: [{medicine_id: 50001, name: Example 500 Tablet, quantity: 1}]
                cart_id: 701
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown request id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [Invalid or expired digitization request_id]}}

  /api/epharmacy/cart:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    get:
      operationId: getCart
      tags: [ePharmacy]
      summary: Get the member's cart
      description: There is one cart per member per plan.
      parameters:
        - $ref: '#/components/parameters/CustomerDetailsApiCustomerId'
        - $ref: '#/components/parameters/PlanIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or cart not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
              example: {success: false, message: Cart not found}
    patch:
      operationId: updateCart
      tags: [ePharmacy]
      summary: Create or update the member's cart
      description: |
        Find-or-create and merge. Send at least one change: `products`, `address` or
        `address_id`, `prescription_urls` / `prescription_files`, `remove_prescription_ids`,
        or `fulfillment_type`. The whole update is atomic: on error the cart is unchanged.

        - `products`: `quantity: 0` removes a line, `> 0` adds or updates it; ids not sent are
          untouched; duplicate ids are rejected.
        - `customer_details` other than `api_customer_id` create or enrich the member; a new
          `api_customer_id` creates the member.
        - Attach a prescription whenever any item has `rx_required: true`.
        - For store pickup, send `fulfillment_type: store_pickup` with `selected_chemist_id`
          (a store `id` from `getFulfillmentOptions`).

        Use `multipart/form-data` (with bracketed field names) to upload `prescription_files[]`.
      x-hlthstack-rules:
        - rule: at_least_one_of
          description: Send at least one change (products, address or address_id, prescription_urls or prescription_files, remove_prescription_ids, fulfillment_type or selected_chemist_id).
          fields: [products, address, address_id, prescription_urls, prescription_files, remove_prescription_ids, fulfillment_type, selected_chemist_id]
        - rule: mutually_exclusive
          description: Send either address or address_id, not both.
          fields: [address, address_id]
        - rule: required_if
          description: selected_chemist_id is required when fulfillment_type is store_pickup (or the cart is already store pickup and fulfillment_type is not sent).
          fields: [selected_chemist_id, fulfillment_type]
        - rule: unique_by
          description: Each product id may appear only once.
          fields: ['products[].id']
        - rule: at_least_one_of
          description: A new address needs pincode or zip_code.
          fields: [address.pincode, address.zip_code]
        - rule: file_limits
          description: Each prescription file must be smaller than 7 MB and be PDF, PNG or JPEG; files fetched from prescription_urls must also be smaller than 7 MB and served as application/pdf, image/png or image/jpeg.
          fields: [prescription_files, prescription_urls]
        - rule: no_conflicting_pincode
          description: A new address's line1, line2, city, state and country must not contain a 6-digit pincode other than its pincode.
          fields: [address.line1, address.line2, address.city, address.state, address.country, address.pincode]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCartRequest'}
            examples:
              products:
                value:
                  plan_id: EXAMPLE_PLAN
                  customer_details:
                    api_customer_id: CUST1001
                    name: Jane Doe
                    dob: '1990-08-24'
                    mobile_number: '9999999999'
                    gender: female
                  products:
                    - {id: 50001, quantity: 2}
                    - {id: 50002, quantity: 0}
              address:
                value:
                  plan_id: EXAMPLE_PLAN
                  customer_details: {api_customer_id: CUST1001}
                  address:
                    line1: 1 Example Road
                    line2: Motera
                    city: Ahmedabad
                    state: Gujarat
                    pincode: '380005'
                    latitude: 23.10
                    longitude: 72.59
              prescriptionUrl:
                value:
                  plan_id: EXAMPLE_PLAN
                  customer_details: {api_customer_id: CUST1001}
                  prescription_urls: ['https://files.example.com/prescription.pdf']
          multipart/form-data:
            schema:
              type: object
              required: ['customer_details[api_customer_id]']
              properties:
                'customer_details[api_customer_id]': {type: string, pattern: '\S'}
                plan_id: {type: string}
                'prescription_files[]':
                  type: array
                  description: Each smaller than 7 MB; PDF, PNG or JPEG.
                  items: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/PlanInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation error; the cart is unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              examples:
                noChange:
                  value: {errors: {messages: [cart updates are required]}}
                unavailable:
                  value: {errors: {messages: [medicine 50002 is unavailable]}}
                address:
                  value: {errors: {messages: [provide either address_id or address]}}

  /api/epharmacy/fulfillment_options:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    get:
      operationId: getFulfillmentOptions
      tags: [ePharmacy]
      summary: Get delivery and pickup options
      description: |
        Live express/standard delivery and store-pickup options for the cart. Slow (typically
        3-8 s). Delivery and pickup are evaluated independently: check the nested `success`
        flags, not just the HTTP status.

        Each option has a `vendor_id` (pass it as `medicine_vendor_id` to
        `getOrderPaymentDetails`) and a `location_token` (pass it to `createOrder`). Tokens are
        specific to one mode or store; fetch options again if the member changes their choice.
      parameters:
        - $ref: '#/components/parameters/CustomerDetailsApiCustomerId'
        - name: cart_id
          in: query
          required: true
          schema: {type: integer}
        - $ref: '#/components/parameters/PlanIdQuery'
      responses:
        '200':
          description: Options (check nested `success`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FulfillmentOptions'}
              example:
                success: true
                delivery_options:
                  success: true
                  standard:
                    vendor_id: 3
                    mrp: 360
                    selling_price: 360
                    additional_charges: 0
                    express_premium: 0
                    total_payable: 360
                    discount_price: 0
                    delivery_details: {type: home_delivery, display_eta: 24-48 hrs}
                    products: []
                    missing_products: []
                    location_token: OPAQUE_TOKEN
                pickup_options:
                  success: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or cart not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
              example: {success: false, message: Cart not found}
        '422':
          description: Empty cart or no address.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
              example: {success: false, message: Delivery address is required}

  /api/epharmacy/orders/payment_details:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    post:
      operationId: getOrderPaymentDetails
      tags: [ePharmacy]
      summary: Price the cart
      description: |
        Final amounts before ordering, including the wallet split. `total_payable` is what
        the member still owes. Note the field is `selected_delivery_option` here but
        `delivery_option` on `createOrder`.
      x-hlthstack-rules:
        - rule: required_if
          description: selected_chemist_id is required when selected_delivery_option is store_pickup (and must match the store saved on the cart).
          fields: [selected_chemist_id, selected_delivery_option]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderPaymentDetailsRequest'}
            example:
              plan_id: EXAMPLE_PLAN
              customer_details: {api_customer_id: CUST1001}
              cart_id: 701
              selected_delivery_option: standard
              medicine_vendor_id: 3
      responses:
        '200':
          description: Pricing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPaymentDetails'}
              example:
                products:
                  - {id: 50001, name: Example 500 Tablet, item_type: allopathy, rx_required: false, quantity: 2, mrp: 50.0, offered_price: 45.0}
                payment_details:
                  total_mrp: 50.0
                  sub_total: 45.0
                  discount: 5.0
                  shipping_charge: 50.0
                  free_shipping: false
                  total_amount: 95.0
                  wallet_deduction: 95.0
                  spending_balance_deduction: 0.0
                  total_payable: 0.0
                estimated_time: 24-48 hrs
                fulfillment:
                  type: delivery
                  delivery_details: {mode: standard, eta: 24-48 hrs, shipping_charge: 50.0, free_shipping: false}
                address: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldErrors'}
              example: {errors: {selected_delivery_option: [is invalid]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or cart not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
        '422':
          description: Pharmacy benefit not enabled, or option not available.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OrderFailure'
                  - $ref: '#/components/schemas/ErrorMessages'
              examples:
                benefit:
                  value: {success: false, errors: {msg: Pharmacy benefit not enabled for this plan, recall: false}}
                option:
                  value: {errors: {messages: [Selected delivery option is not available]}}

  /api/epharmacy/orders:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    post:
      operationId: createOrder
      tags: [ePharmacy]
      summary: Place an order
      description: |
        Places an order from the cart. The response `status` depends on your payment flow
        (fixed per contract):

        - `confirmed`: the wallet covered the whole amount.
        - `payment_pending`: send `payment_link` to the member; unpaid orders are abandoned
          after 3 hours.
        - `partner_payment_pending`: collect `amount_to_collect` yourself, then call
          `confirmOrder`; unconfirmed orders are abandoned after 3 hours.

        For store pickup, set it on the cart first (`updateCart`); don't pass the store here.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
            example:
              plan_id: EXAMPLE_PLAN
              customer_details: {api_customer_id: CUST1001}
              cart_id: 701
              delivery_option: standard
              location_token: OPAQUE_TOKEN
      responses:
        '200':
          description: Order placed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateOrderResponse'}
              examples:
                confirmed:
                  value:
                    success: true
                    status: confirmed
                    booking_id: 90001
                    user_prescription_details: {status: confirmed, unique_id: EPO000000000001}
                paymentPending:
                  value:
                    success: true
                    status: payment_pending
                    payment_link: https://pay.example.com/abc
                    booking_id: 90002
                    user_prescription_details: {status: received, unique_id: EPO000000000002}
                partnerPaymentPending:
                  value:
                    success: true
                    status: partner_payment_pending
                    booking_id: 90003
                    order_id: EPO000000000003
                    amount_to_collect: 261.0
                    currency: INR
                    user_prescription_details: {status: received, unique_id: EPO000000000003}
        '400':
          $ref: '#/components/responses/PlanInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
        '422':
          description: Benefit not enabled, pricing/booking failure, unserviceable address or missing prescription.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderFailure'}
              example: {success: false, errors: {msg: Pharmacy benefit not enabled for this plan, recall: false}}
    get:
      operationId: listOrders
      tags: [ePharmacy]
      summary: List a member's orders
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/CustomerDetailsApiCustomerId'
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema: {type: integer, default: 10}
      responses:
        '200':
          description: Orders.
          content:
            application/json:
              schema:
                type: object
                required: [success, orders, meta]
                properties:
                  success: {type: boolean}
                  orders:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      next_page: {type: [integer, 'null']}
                      prev_page: {type: [integer, 'null']}
                      total_pages: {type: integer}
                      total_count: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}

  /api/epharmacy/orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/OrderIdPath'
    get:
      operationId: getOrder
      tags: [ePharmacy]
      summary: Get an order
      description: The source of truth for an order's state; use it to reconcile webhooks.
      parameters:
        - $ref: '#/components/parameters/CustomerDetailsApiCustomerId'
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema:
                type: object
                required: [success, order]
                properties:
                  success: {type: boolean}
                  order: {$ref: '#/components/schemas/Order'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or order not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
              example: {success: false, message: Order not found}

  /api/epharmacy/orders/{order_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/OrderIdPath'
    patch:
      operationId: cancelOrder
      tags: [ePharmacy]
      summary: Cancel an order
      description: |
        Possible only before the pharmacy ships (vendor-specific) and never for split orders.
        Refunds to wallets and payment methods run automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_details]
              properties:
                plan_id: {type: string}
                customer_details: {$ref: '#/components/schemas/CustomerDetailsRef'}
                reason: {type: string, default: Cancel order}
                message: {type: string, description: "Free text, for example when reason is \"other\"."}
            example:
              customer_details: {api_customer_id: CUST1001}
              reason: Ordered by mistake
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [success, order_id, status]
                properties:
                  success: {type: boolean}
                  order_id: {type: string}
                  status: {type: string}
              example: {success: true, order_id: EPO000000000001, status: cancelled}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or order not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
        '422':
          description: Cannot be cancelled.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/SuccessFalseMessage'
                  - $ref: '#/components/schemas/ErrorMessages'
              examples:
                window:
                  value: {success: false, message: Order cannot be cancelled}
                already:
                  value: {errors: {messages: [Order already cancelled]}}

  /api/epharmacy/orders/{order_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/OrderIdPath'
    post:
      operationId: confirmOrder
      tags: [ePharmacy]
      summary: Confirm a partner-collected payment
      description: |
        Partner-collected flow only. Tells hlthstack you collected `amount_to_collect`.
        `partner_collected_amount` must equal it exactly. Safe to retry: the same amount and
        reference returns `already_confirmed`. On 409, back off and retry.
      x-hlthstack-rules:
        - rule: positive_decimal
          description: partner_collected_amount must be a decimal greater than 0 (it must also equal the order's amount_to_collect).
          fields: [partner_collected_amount]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_details, partner_collected_amount, partner_payment_reference]
              properties:
                customer_details: {$ref: '#/components/schemas/CustomerDetailsRef'}
                partner_collected_amount:
                  type: [string, number]
                  exclusiveMinimum: 0
                  description: Decimal amount greater than 0, for example "261.0".
                partner_payment_reference:
                  type: string
                  pattern: '\S'
                  description: Your payment/transaction reference (not blank; surrounding whitespace is trimmed).
            example:
              customer_details: {api_customer_id: CUST1001}
              partner_collected_amount: '261.0'
              partner_payment_reference: TXN-0001
      responses:
        '200':
          description: Confirmed (or already confirmed with the same reference).
          content:
            application/json:
              schema:
                type: object
                required: [success, status, order_id]
                properties:
                  success: {type: boolean}
                  status: {type: string, enum: [confirmed, already_confirmed]}
                  order_id: {type: string}
                  partner_collected_amount: {type: number}
                  partner_payment_reference: {type: string}
                  vendor_order_status:
                    type: string
                    description: '`placement_started` while the order is still being placed, otherwise the order status.'
              example:
                success: true
                status: confirmed
                order_id: EPO000000000003
                partner_collected_amount: 261.0
                partner_payment_reference: TXN-0001
                vendor_order_status: onhold
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or order not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
        '409':
          description: A concurrent confirmation is in progress. Retry later.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfirmOrderError'}
              example: {success: false, status: transaction_locked, errors: {base: Transaction is locked}}
        '422':
          description: Invalid payment. `errors` is an array of strings or an object with `base`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfirmOrderError'}
              example: {success: false, status: invalid_payment, errors: [Payment amount does not match the order amount]}

  /api/epharmacy/orders/{order_id}/update_status:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/OrderIdPath'
    patch:
      operationId: simulateOrderStatus
      tags: [Testing]
      summary: (Staging only) Move an order to a new status
      description: |
        **Staging only**; the route does not exist in production (404). Records a status
        change and fires the same `status_update` webhook a pharmacy update would. The
        optional text and tracking fields are passed through to the webhook.
      servers:
        - url: https://staging-api.hlthstack.io
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_details, status]
              properties:
                customer_details: {$ref: '#/components/schemas/CustomerDetailsRef'}
                status:
                  type: string
                  description: An order status (see `PharmacyOrderStatus`).
                  enum: [received, cancellation_request, cancellation_inprogress, consultation_required, processed, rejected, invoice_pending, invoice_generated, onhold, cancelled, abandoned, packing, packed, delivery_postponed, out_for_delivery, delivered, in_transit, in_delivery, created, verification_pending, verified, failed, in_progress, error, out_of_stock, returned_and_refunded, returned, under_ops_verification, prescription_under_verification, prescription_on_hold, prescription_rejected, prescription_cancelled, ops_verified, ops_rejected]
                status_text: {type: string}
                status_description: {type: string}
                tracking_number: {type: string}
                tracking_url: {type: string}
                tracking_partner: {type: string}
            example:
              customer_details: {api_customer_id: CUST1001}
              status: in_progress
              status_text: Order is being processed
      responses:
        '200':
          description: Status changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  order_id: {type: string}
                  status: {type: string}
                  journey:
                    type: array
                    description: Status history, newest first.
                    items: {type: object}
              example:
                success: true
                order_id: EPO000000000001
                status: in_progress
                journey:
                  - {id: 501, status: in_progress, status_text: Order is being processed, created_at: '2026-01-15T09:26:03.000+05:30'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or order not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
        '422':
          description: Not a valid order status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessFalseMessage'}
              example: {success: false, message: 'Invalid status: shipped'}

  # ---------------------------------------------------------------- Wallet
  /api/{company_slug}/customers/wallet:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/CompanySlug'
    get:
      operationId: getCustomerWallet
      tags: [Wallet]
      summary: Get a member's benefit wallet
      description: |
        Allocated and available amounts per benefit for the member and their active family,
        primary member first. Identify the member by `api_customer_id` or `customer_id`
        (`api_customer_id` wins when both are sent); a dependant's id returns the whole
        family. Send `customer_plan_id` or `subscription_id` to read one subscription
        (upcoming and ended ones included).
      x-hlthstack-rules:
        - rule: at_least_one_of
          description: Send api_customer_id or customer_id.
          fields: [api_customer_id, customer_id]
      parameters:
        - $ref: '#/components/parameters/PlanIdQuery'
        - name: api_customer_id
          in: query
          schema: {type: string}
        - name: customer_id
          in: query
          description: hlthstack's customer id.
          schema: {type: string}
        - $ref: '#/components/parameters/CustomerPlanIdQuery'
        - $ref: '#/components/parameters/SubscriptionIdQuery'
      responses:
        '200':
          description: Wallet details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WalletResponse'}
              example:
                status: success
                data:
                  members:
                    - name: Jane Doe
                      gender: FEMALE
                      dob: '1990-08-24'
                      phone: '9999999999'
                      email: jane@example.com
                      relationship: SELF
                      member_status: ACTIVE
                      relation: self
                      wallet_details:
                        benefits:
                          - benefit_type: pharmacy
                            allocated_benefit_amount: 12500.0
                            available_benefit_amount: 10000.0
                            allocated_benefit_utilization_count: 0
                            current_benefit_utilization_count: 0
                        total_allocated_amount: 12500.0
                        available_amount: 10000.0
        '400':
          $ref: '#/components/responses/PlanInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidCompanySlug'
        '404':
          description: No customer or wallet found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimpleError'}
              example: {error: No wallet details found for the provided customer and plan.}
        '422':
          $ref: '#/components/responses/CustomerIdRequired'

  /api/{company_slug}/customers/plans:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/CompanySlug'
    get:
      operationId: listCustomerPlans
      tags: [Wallet]
      summary: List a member's plan subscriptions
      description: |
        One row per subscription (active, upcoming or in grace; fully lapsed ones are left
        out). Use `customer_plan_id` to choose which subscription pays when booking or
        ordering.
      x-hlthstack-rules:
        - rule: at_least_one_of
          description: Send api_customer_id or customer_id.
          fields: [api_customer_id, customer_id]
      parameters:
        - name: api_customer_id
          in: query
          schema: {type: string}
        - name: customer_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerPlansResponse'}
              example:
                status: success
                data:
                  customer_plans:
                    - customer_plan_id: 101
                      subscription_id: SUB-0001
                      plan_id: EXAMPLE_TOPUP
                      plan_name: Top-up
                      start_date: '2026-01-01'
                      end_date: '2026-12-31'
                      grace_end_date: '2027-01-31'
                      status: active
                      available_balance: 1500.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidCompanySlug'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimpleError'}
              example: {error: Customer not found.}
        '422':
          $ref: '#/components/responses/CustomerIdRequired'

  # ---------------------------------------------------------------- Pre-registration
  /api/pre_registration/access-token:
    get:
      operationId: getPreRegistrationAccessToken
      tags: [Pre-registration]
      summary: Get a pre-registration access token
      description: |
        Exchanges your **pre-registration** credentials (HTTP Basic: the account email and
        password hlthstack issued for pre-registration, not your booking API credentials) for
        a token. Send it as the `X-EKINCARE-KEY` header on the other pre-registration calls.

        The token is valid for 1 hour. `expires_at` is a UTC timestamp in the form
        `2026-01-15 07:16:21 UTC` (not ISO 8601). Every call issues a new token; there is no
        refresh token.
      security:
        - preRegistrationBasicAuth: []
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreRegistrationAccessToken'}
              example:
                access_token: YOUR_PRE_REGISTRATION_TOKEN
                expires_at: '2026-01-15 07:16:21 UTC'
        '401':
          description: Missing or wrong credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageError'}
              example: {message: Wrong credentials}

  /v1/corporate/pre_registrations:
    post:
      operationId: createPreRegistrations
      tags: [Pre-registration]
      summary: Pre-register members and dependants
      description: |
        Queues members (`employees`) and their dependants for registration and returns a
        `request_id`. Processing is asynchronous: poll `getPreRegistrationStatus` for each
        row's outcome. Employees are processed before dependants, so a dependant can refer to
        an employee sent in the same request.

        - Send `employees`, `dependants` or both; at most **250 rows in total** per request.
        - **Every key marked required must be present in every row**, even when its value is
          empty (`""` or `null`). A row missing a required key is dropped silently: it is not
          registered and is not reported in the status. If no row is left, the call fails
          with `400`.
        - Each employee needs `company_id` (a company your credentials can act on) and an
          `email` or an `employee_code`.
        - Each dependant is linked to its employee by `guardian_email`, or by `company_id`
          plus `guardian_employee_code` when the employee has no email.
        - Row values are checked while the request is processed; a row that fails a check is
          reported in `failure_records` (see the field patterns and `x-hlthstack-rules`).
      x-hlthstack-rules:
        - rule: item_count
          description: At most 250 rows in employees and dependants together.
          fields: [employees, dependants]
        - rule: at_least_one_of
          description: Each employee needs a non-blank email or employee_code.
          fields: ['employees[].email', 'employees[].employee_code']
        - rule: at_least_one_of
          description: Each dependant needs guardian_email, or company_id together with guardian_employee_code.
          fields: ['dependants[].guardian_email', 'dependants[].guardian_employee_code']
        - rule: relative_date
          description: date_of_birth (when not blank) must not be after today.
          fields: ['employees[].date_of_birth', 'dependants[].date_of_birth']
      security:
        - preRegistrationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePreRegistrationsRequest'}
            example:
              employees:
                - employee_code: EMP1001
                  company_id: '1001'
                  first_name: Jane
                  last_name: Doe
                  email: jane.doe@example.com
                  date_of_birth: 24-08-1990
                  gender: Female
                  employee_office_location: Hyderabad
                  department: Engineering
                  mobile_number: '9999999999'
                  vip: 'No'
                  entity_name: ''
                  grade: B
                  date_of_joining: 01-01-2026
                  voluntary_plan_ids: [EXAMPLE_TOPUP]
              dependants:
                - guardian_email: jane.doe@example.com
                  dependent_code: DEP-001
                  first_name: John
                  last_name: Doe
                  date_of_birth: 10-02-1960
                  gender: Male
                  mobile_number: '9999999998'
                  relation: Father
      responses:
        '200':
          $ref: '#/components/responses/PreRegistrationAccepted'
        '400':
          $ref: '#/components/responses/PreRegistrationInvalid'
        '401':
          $ref: '#/components/responses/PreRegistrationUnauthorized'
        '403':
          $ref: '#/components/responses/PreRegistrationForbidden'
        '422':
          $ref: '#/components/responses/PreRegistrationFailed'

  /v1/corporate/pre_registrations/update:
    post:
      operationId: updatePreRegistrations
      tags: [Pre-registration]
      summary: Update registered members and dependants
      description: |
        Queues updates to registered members and dependants and returns a `request_id`; poll
        `getPreRegistrationStatus` for each row's outcome. Send only the identifier and the
        fields to change. At most 250 rows in total per request.

        - An employee is found by `email`, or by `company_id` plus `employee_code` when no
          email is sent. The email itself can't be changed here.
        - A dependant is found by `api_customer_id`, then `dependent_code`, under the employee
          given by `guardian_email` (or `company_id` plus `guardian_employee_code`); otherwise
          by `mobile_number`, which must match exactly one dependant. At least one of
          `api_customer_id`, `dependent_code` or `mobile_number` is required.
        - `mobile_number` in an update is stored as the member's alternate mobile number.
        - `voluntary_plan_ids` takes the same entries as `createPreRegistrations`. On a
          dependant it is refused (the rest of the row is still applied).
      x-hlthstack-rules:
        - rule: item_count
          description: At most 250 rows in employees and dependants together.
          fields: [employees, dependants]
        - rule: at_least_one_of
          description: Each employee needs email, or company_id together with employee_code.
          fields: ['employees[].email', 'employees[].employee_code']
        - rule: at_least_one_of
          description: Each dependant needs api_customer_id, dependent_code or mobile_number.
          fields: ['dependants[].api_customer_id', 'dependants[].dependent_code', 'dependants[].mobile_number']
      security:
        - preRegistrationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePreRegistrationsRequest'}
            example:
              employees:
                - email: jane.doe@example.com
                  department: Finance
                  grade: C
              dependants:
                - guardian_email: jane.doe@example.com
                  dependent_code: DEP-001
                  last_name: Doe-Smith
      responses:
        '200':
          $ref: '#/components/responses/PreRegistrationAccepted'
        '400':
          $ref: '#/components/responses/PreRegistrationInvalid'
        '401':
          $ref: '#/components/responses/PreRegistrationUnauthorized'
        '403':
          $ref: '#/components/responses/PreRegistrationForbidden'
        '422':
          $ref: '#/components/responses/PreRegistrationFailed'

  /v1/corporate/pre_registrations/deactivate:
    post:
      operationId: deactivatePreRegistrations
      tags: [Pre-registration]
      summary: Deactivate members or dependants
      description: |
        Queues deactivations and returns a `request_id`; poll `getPreRegistrationStatus` for
        each one's outcome. `employees` lists employee emails, `dependants` lists dependant
        mobile numbers. At most 250 entries in total per request.

        Deactivating an employee also deactivates all their dependants and cancels their
        ongoing appointments. Only members of companies your credentials can act on are
        deactivated.
      x-hlthstack-rules:
        - rule: item_count
          description: At most 250 entries in employees and dependants together.
          fields: [employees, dependants]
      security:
        - preRegistrationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeactivatePreRegistrationsRequest'}
            example:
              employees: [jane.doe@example.com]
      responses:
        '200':
          $ref: '#/components/responses/PreRegistrationAccepted'
        '400':
          $ref: '#/components/responses/PreRegistrationInvalid'
        '401':
          $ref: '#/components/responses/PreRegistrationUnauthorized'
        '403':
          $ref: '#/components/responses/PreRegistrationForbidden'
        '422':
          $ref: '#/components/responses/PreRegistrationFailed'

  /v1/corporate/pre_registrations/{request_id}/status:
    parameters:
      - name: request_id
        in: path
        required: true
        description: The `request_id` returned by a create, update or deactivate call.
        schema: {type: string, format: uuid}
        example: 3f2b8c1e-0d4a-4c5e-9b7a-2e6f1d8c9a01
    get:
      operationId: getPreRegistrationStatus
      tags: [Pre-registration]
      summary: Get the outcome of a pre-registration request
      description: |
        The request's processing `status` and its rows, split into `success_records` and
        `failure_records`. Poll until `status` is `completed`; records are added while the
        request is `inprogress`.

        - Create and update requests: each success record is the member as stored (dependants
          included, with `guardian_email` and `relation`); employees carry `customer_plans`.
          Each failure record echoes the row with its `errors`.
        - Deactivate requests: success records carry `status` (`Active`/`Inactive`);
          failure records are `{"errors": ["..."]}` only.
      security:
        - preRegistrationKey: []
      responses:
        '200':
          description: The request and its results so far.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreRegistrationStatus'}
              example:
                request_id: 3f2b8c1e-0d4a-4c5e-9b7a-2e6f1d8c9a01
                status: completed
                success_records:
                  - employee_code: EMP1001
                    first_name: Jane
                    last_name: Doe
                    email: jane.doe@example.com
                    date_of_birth: '1990-08-24'
                    gender: Female
                    mobile_number: '9999999999'
                    vip: 'No'
                    entity_name: null
                    employee_office_location: Hyderabad
                    department: Engineering
                    customer_token: EXAMPLE_CUSTOMER_TOKEN
                    errors: []
                    grade: B
                    guardian_email: null
                    relation: null
                    customer_plans:
                      - customer_plan_id: 101
                        subscription_id: null
                        plan_id: EXAMPLE_TOPUP
                        plan_name: Top-up
                        start_date: '2026-01-15'
                        end_date: '2026-12-31'
                        grace_end_date: '2027-01-31'
                        status: active
                failure_records:
                  - employee_code: EMP1002
                    first_name: Sam
                    last_name: Roe
                    email: sam.roe@example
                    date_of_birth: 31-02-1990
                    gender: Male
                    mobile_number: '12345'
                    vip: 'No'
                    entity_name: ''
                    employee_office_location: Hyderabad
                    department: Engineering
                    guardian_email: null
                    errors:
                      - Email is invalid
                      - Date of birth is invalid - valid format is DD-MM-YYYY or DD/MM/YYYY
                      - Mobile number is not in the correct format for India
                created_at: '2026-01-15T06:16:21Z'
        '401':
          $ref: '#/components/responses/PreRegistrationUnauthorized'
        '403':
          $ref: '#/components/responses/PreRegistrationForbidden'
        '404':
          description: No request with that id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageError'}
              example: {message: Request couldn't find with the id provided}
        '422':
          description: The status could not be read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageError'}
              example: {message: Something went wrong}

# ================================================================== Webhooks
webhooks:
  appointmentStatusUpdate:
    post:
      operationId: onAppointmentStatusUpdate
      tags: [Health Checkups]
      summary: Appointment status changed or reports uploaded
      description: |
        Sent to your `status_updates` endpoint on every appointment status change.
        `type` is `reports_upload` when the appointment is `partially_received`/`received`
        and report links are present, otherwise `status_update`. Verify the `Signature`
        header (see the webhooks guide). Reply 2xx within 30 seconds.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentDetails'}
            example:
              booking_id: EKI0000000001700000000
              appointment_id: APT1A2B3C4D5
              customer_id: EKI000000001
              customer_name: Jane Doe
              mobile_number: '9999999999'
              api_customer_id: CUST1001
              member_id: EMP0001
              appointment_date_time: '2030-01-15T02:30:00Z'
              event_timestamp: 1768440000.123
              booking_source: hlthstack-api
              service_type: ahc
              plan_id: EXAMPLE_PLAN
              customer_plan_id: null
              subscription_id: null
              status: confirmed
              status_text: Confirmed
              comment: Your appointment is confirmed.
              provider_id: 1001
              provider_name: Example Diagnostics
              provider_branch: Madhapur
              provider_address: 1 Example Road, Madhapur, Hyderabad
              voucher_api_url: https://api.hlthstack.io/api/appointments/APT1A2B3C4D5/voucher
              phlebo_name: John Doe
              phlebo_number: '+919999999999'
              type: status_update
              payment:
                status: captured
                total_collected_amount: '0.0'
                razorpay_amount: '0.0'
                razorpay_payment_id: null
                razorpay_order_id: null
                customer_wallet_amount: '0.0'
                sponsor_wallet_amount: '0.0'
                promotional_wallet_amount: '0.0'
                cod_amount: '0.0'
                h_points_amount: '0.0'
                refunded_amount: '0.0'
                captured_at: '2026-01-14T07:03:10Z'
                refunded_at: null
      responses:
        '200':
          description: Acknowledge receipt with any 2xx.
  consultationStatusUpdate:
    post:
      operationId: onConsultationStatusUpdate
      tags: [Consultations]
      summary: Consultation status changed
      description: |
        Same endpoint and envelope as `appointmentStatusUpdate`, with `service_type`
        `inclinic_consultation` or `specialist_consultation` plus doctor fields, `summary`,
        `doctor_prescriptions`, hospital fields (in-clinic) and `meeting_link` (video).
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentDetails'}
            example:
              booking_id: EKI0000000001700000000
              appointment_id: APT1A2B3C4D5
              customer_id: EKI000000001
              api_customer_id: CUST1001
              appointment_date_time: '2030-01-15T04:30:00Z'
              booking_source: hlthstack-api
              service_type: specialist_consultation
              status: confirmed
              status_text: Confirmed
              comment: ''
              provider_id: 3001
              doctor_id: DOC000000002
              doctor_name: Dr. Jane Doe
              doctor_specialities: [Neurology]
              doctor_gender: Female
              doctor_qualification: MBBS, MD
              doctor_languages: [English]
              doctor_experience: 10
              meeting_link: https://meet.example.com/abc
              summary: null
              doctor_prescriptions: []
              type: status_update
      responses:
        '200':
          description: Acknowledge receipt with any 2xx.
  labResults:
    post:
      operationId: onLabResults
      tags: [Health Checkups]
      summary: Digitized lab results available
      description: Sent to your separately registered `lab_results` endpoint (enabled on request).
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LabResultsPayload'}
      responses:
        '200':
          description: Acknowledge receipt with any 2xx.
  pharmacyOrderStatusUpdate:
    post:
      operationId: onPharmacyOrderStatusUpdate
      tags: [ePharmacy]
      summary: Pharmacy order status changed
      description: |
        Sent to your `status_updates` endpoint on every order status change, including
        refunds. Each body is a full snapshot. Delivery order is not guaranteed: use the
        signature timestamp and `getOrder` to reconcile.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PharmacyOrderWebhook'}
      responses:
        '200':
          description: Acknowledge receipt with any 2xx.
  pharmacyPostBilling:
    post:
      operationId: onPharmacyPostBilling
      tags: [ePharmacy]
      summary: Partner-collected order settled
      description: |
        Partner-collected flow only. Sent when every order in the tree is final.
        `settlement.adjustment_amount` is what you owe the member back. The latest one wins.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PharmacyPostBillingWebhook'}
      responses:
        '200':
          description: Acknowledge receipt with any 2xx.
  pharmacyAdditionalPaymentRequired:
    post:
      operationId: onPharmacyAdditionalPaymentRequired
      tags: [ePharmacy]
      summary: Partner-collected order needs more money
      description: Partner-collected flow only. Collect `additional_payment.amount_payable` from the member.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PharmacyAdditionalPaymentWebhook'}
      responses:
        '200':
          description: Acknowledge receipt with any 2xx.
  prescriptionDigitized:
    post:
      operationId: onPrescriptionDigitized
      tags: [ePharmacy]
      summary: Prescription digitization finished
      description: Sent to your `digitization_results` endpoint when a request reaches `completed`, `partial`, `rejected` or `failed`.
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrescriptionDigitizedWebhook'}
      responses:
        '200':
          description: Acknowledge receipt with any 2xx.

# ================================================================== Components
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Username and password issued by hlthstack. Used only by `getAccessToken`.
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from `getAccessToken`, valid for 1 hour.
    preRegistrationBasicAuth:
      type: http
      scheme: basic
      description: |
        Pre-registration credentials issued by hlthstack: the account email as the username,
        and its password. Separate from the booking API credentials. Used only by
        `getPreRegistrationAccessToken`.
    preRegistrationKey:
      type: apiKey
      in: header
      name: X-EKINCARE-KEY
      description: |
        Token from `getPreRegistrationAccessToken`, valid for 1 hour. Send the token itself,
        without a `Bearer` prefix.

  parameters:
    ApiEntityId:
      name: API-ENTITY-ID
      in: header
      required: false
      description: |
        Multi-entity partners: the id of the entity to act for. When omitted, the entity
        tied to your credentials is used. Requires `API-SECRET-KEY`.
      schema: {type: string}
    ApiSecretKey:
      name: API-SECRET-KEY
      in: header
      required: false
      description: For multi-entity partners, the secret key issued with your credentials. Required when `API-ENTITY-ID` is sent.
      schema: {type: string}
    WebhookSignature:
      name: Signature
      in: header
      required: true
      description: HS256 JWT signed with your webhook secret. See the webhooks guide for the claims.
      schema: {type: string}
    ServiceName:
      name: service_name
      in: query
      required: true
      description: |
        The service to search for. Common values: `ahc` (health checks), `dental`, `vision`,
        `flu_vaccination`, `covid_vaccination`, `inclinic_consultation`. The value must be a
        known benefit type (see `BenefitType`), and the service must be enabled for your
        plan (otherwise 403). `benefit_type` is accepted as an alias.
      schema: {$ref: '#/components/schemas/BenefitType'}
    PackageIdsQuery:
      name: package_ids
      in: query
      required: true
      description: |
        Comma-separated package ids shared at onboarding, for example `1001,1002`. Each id
        must be a package of the requested benefit. The pattern is the server's own,
        unanchored check.
      schema: {type: string, pattern: '[0-9]+(,[0-9]+)*'}
      example: '1001,1002'
    PincodeQuery:
      name: pincode
      in: query
      description: |
        6-digit pincode. Required unless `latitude` and `longitude` are sent (the pincode is
        then derived from them).
      schema: {type: string, pattern: '^[0-9]{6}$'}
      example: '500081'
    LatitudeQuery:
      name: latitude
      in: query
      description: |
        Decimal latitude. Required unless `pincode` is sent. When no pincode can be derived
        from the coordinates, the value must be non-negative and include a decimal point
        (for example `17.0`, not `17`).
      schema: {type: number}
      example: 17.4437
    LongitudeQuery:
      name: longitude
      in: query
      description: |
        Decimal longitude. Required unless `pincode` is sent. When no pincode can be derived
        from the coordinates, the value must be non-negative and include a decimal point.
      schema: {type: number}
      example: 78.3860
    PlanIdQuery:
      name: plan_id
      in: query
      description: Plan identifier shared at onboarding. Defaults to the base plan.
      schema: {type: string}
    CustomerPlanIdQuery:
      name: customer_plan_id
      in: query
      description: hlthstack's subscription id (from `listCustomerPlans`).
      schema: {type: integer, minimum: 0}
    SubscriptionIdQuery:
      name: subscription_id
      in: query
      description: Your own subscription id, if sent at enrollment.
      schema: {type: string}
    Page:
      name: page
      in: query
      description: Page number. Values below 1 are read as 1.
      schema: {type: integer, default: 1}
    PerPage:
      name: per_page
      in: query
      description: Page size, at most 50. Values below 1 are read as 1.
      schema: {type: integer, maximum: 50, default: 20}
    SortBy:
      name: sort_by
      in: query
      description: In-clinic consultations only. `visited_before` also needs `api_customer_id`.
      schema: {type: string, enum: [fee, experience, distance, rating, visited_before]}
    SortAsc:
      name: sort_asc
      in: query
      description: In-clinic consultations only. Default ascending for fee/distance, descending for experience/rating.
      schema: {type: boolean}
    DoctorGender:
      name: gender
      in: query
      description: In-clinic consultations only. Filter doctors by gender. `Male`, `Female` or `Non-binary`, any case.
      schema:
        type: string
        pattern: '^(?:[Mm][Aa][Ll][Ee]|[Ff][Ee][Mm][Aa][Ll][Ee]|[Nn][Oo][Nn]-[Bb][Ii][Nn][Aa][Rr][Yy])$'
        examples: [Male, Female, Non-binary]
    VisitedBeforeCustomer:
      name: api_customer_id
      in: query
      description: Required with `sort_by=visited_before`.
      schema: {type: string}
    BookingIdPath:
      name: booking_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/BookingId'}
    AppointmentIdPath:
      name: appointment_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AppointmentId'}
    OrderIdPath:
      name: order_id
      in: path
      required: true
      description: The order's `unique_id`.
      schema: {type: string}
      example: EPO000000000001
    CompanySlug:
      name: company_slug
      in: path
      required: true
      description: Your company slug, shared at onboarding. Must match the entity of the access token.
      schema: {type: string}
    CustomerDetailsApiCustomerId:
      name: customer_details[api_customer_id]
      in: query
      required: true
      description: Your id for the member.
      schema: {type: string}

  responses:
    Unauthorized:
      description: Missing, invalid or expired access token. (Bad entity headers return 400 instead.)
      content:
        text/plain:
          schema: {type: string}
          example: 'HTTP Token: Access denied.'
    ValidationError:
      description: |
        Invalid parameters. Also returned for invalid `plan_id`, invalid
        `customer_plan_id`/`subscription_id`, bad `API-ENTITY-ID`/`API-SECRET-KEY`, or an entity
        not enabled for API booking (`{"message": "..."}`).
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/FieldErrors'
              - $ref: '#/components/schemas/MessageError'
          example:
            errors:
              service_name: ["can't be blank", is not a valid service_name]
              package_ids: [should be an integer array]
    PlanInvalid:
      description: Invalid `plan_id` or entity headers.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/FieldErrors'
              - $ref: '#/components/schemas/MessageError'
          example: {errors: {plan_id: [is invalid]}}
    ServiceNotEnabled:
      description: The service is not enabled for your plan.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FieldErrors'}
          example: {errors: {service_name: [this service is not enabled for you]}}
    ServerError:
      description: Internal error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessages'}
    UnprocessableMessages:
      description: The request could not be processed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorMessages'}
    InvalidAppointmentId:
      description: Malformed appointment id.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FieldErrors'}
          example: {errors: {appointment_id: [invalid appointment_id]}}
    NotYourAppointment:
      description: Appointment not found for your entity.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FieldErrors'}
          example: {errors: {appointment_id: [invalid appointment_id]}}
    NotYourBooking:
      description: Booking not found for your entity.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FieldErrors'}
          example: {errors: {booking_id: [invalid booking_id]}}
    DifferentProvider:
      description: Cannot move to a different provider once confirmed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FieldErrors'}
          example: {errors: {provider_id: [Appointment cannot be rescheduled to a different provider.]}}
    InvalidCompanySlug:
      description: '`company_slug` does not match the authenticated entity.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SimpleError'}
          example: {error: Invalid company slug for authenticated partner.}
    CustomerIdRequired:
      description: Neither `api_customer_id` nor `customer_id` was sent.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FieldErrors'}
          example: {errors: {base: [At least one of api_customer_id or customer_id must be provided.]}}
    Cart:
      description: The cart.
      content:
        application/json:
          schema:
            type: object
            required: [success, cart]
            properties:
              success: {type: boolean}
              cart: {$ref: '#/components/schemas/Cart'}
    ConsultationCreated:
      description: |
        Consultation booked. `status: confirmed` is present when the wallet paid in full;
        `payment_link` is present when the member must pay.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateConsultationResponse'}
          example:
            provider_id: 2001
            booking_id: EKI0000000001700000000
            customers:
              - customer_id: EKI000000001
                name: Jane Doe
                api_customer_id: CUST1001
                package_ids: [2001]
                appointment_id: APT1A2B3C4D5
                consultation_status: new
                customer_plan_id: null
                subscription_id: null
    ConsultationBookingError:
      description: Validation error, invalid subscription, or booking failure.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/FieldErrors'
              - $ref: '#/components/schemas/BookingFailure'
          example: {errors: {service_mode: ['must be one of audio_call, video_call for specialist_consultation']}}
    ConsultationBookingConflict:
      description: Duplicate booking or booking error.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ErrorMessages'
              - $ref: '#/components/schemas/BookingFailure'
          example: {errors: {messages: [customer has an ongoing appointment for same package and provider for same slot]}}
    PreRegistrationAccepted:
      description: Accepted for processing. Poll `getPreRegistrationStatus` with `request_id`.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PreRegistrationAccepted'}
          example:
            message: Request has been accepted
            request_id: 3f2b8c1e-0d4a-4c5e-9b7a-2e6f1d8c9a01
    PreRegistrationInvalid:
      description: |
        `missing param or invalid params`: `employees`/`dependants` is not a non-empty array,
        or no row has all the required keys. `Request is too large`: more than 250 rows in
        total.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MessageError'}
          examples:
            invalid:
              value: {message: missing param or invalid params}
            tooLarge:
              value: {message: Request is too large}
    PreRegistrationUnauthorized:
      description: |
        Missing, invalid or expired `X-EKINCARE-KEY` token, or the company's contract has
        ended. The body is empty.
    PreRegistrationForbidden:
      description: The account's role may not use the pre-registration API. The body is empty.
    PreRegistrationFailed:
      description: The request could not be queued.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MessageError'}
          example: {message: something went wrong}

  schemas:
    # ---------- generic
    AccessToken:
      type: object
      required: [access_token, expires_at]
      properties:
        access_token: {type: string}
        expires_at: {type: string, format: date-time}
    Message:
      type: object
      required: [message]
      properties:
        message: {type: string}
    Messages:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: {type: string}
    MessageError:
      type: object
      required: [message]
      properties:
        message: {type: string}
    SimpleError:
      type: object
      required: [error]
      properties:
        error: {type: string}
    FieldErrors:
      type: object
      description: Errors keyed by field name. Nested fields are prefixed (e.g. `customer_mobile_number`, `address_pincode`).
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
    ErrorMessages:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: {type: string}
    ErrorList:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items: {type: string}
    SuccessFalseMessage:
      type: object
      required: [success, message]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
    BookingFailure:
      type: object
      description: Booking could not be completed. `recall` or `id` may be present.
      properties:
        msg: {type: string}
        recall: {type: boolean}
        id: {}
    PartialResult:
      type: object
      required: [message]
      properties:
        message: {type: string}
        success:
          type: string
          description: Comma-separated appointment ids that succeeded (partial result only).
        failed:
          type: string
          description: Comma-separated appointment ids that failed (partial result only).
    FileLink:
      type: [object, 'null']
      properties:
        file_name: {type: [string, 'null']}
        file_url: {type: [string, 'null']}

    BookingId:
      type: string
      description: '`EKI` followed by 19 characters (22 in all). The pattern is the server''s own, unanchored check.'
      pattern: 'EKI[0-9A-Z_]{19}'
      example: EKI0000000001700000000
    AppointmentId:
      type: string
      description: '`APT` followed by 9 characters (12 in all). The pattern is the server''s own, unanchored check.'
      pattern: 'APT[0-9A-Z_]{9}'
      example: APT1A2B3C4D5
    BenefitType:
      type: string
      description: A benefit type. The service must also be enabled on your plan.
      enum: [ahc, dental, vision, fitness, pharmacy, eap, family_doctor, pre_employment, covid_vaccination, flu_vaccination, other_health_checks, rtpcr, specialist_consultation, pregnancy_care, ohc, annual_calendar, health_coach, health_insurance, face_to_face_consults, daycare_surgeries, ambulance_on_demand, supplementary_insurance, elder_care, home_care, healthcare_financing, nhc, diet_consultation, inclinic_consultation, fertility_treatment, consultation24x7, imaging_services, occupational_medical_rooms, cancer_screening, onsite_camp, filler_benefit_one, filler_benefit_two, filler_benefit_three, filler_benefit_four, prescribed_diagnostics, ppmc, weight_management_program, diabetic_program, bp_program, cervical_vaccination, physiotherapy, prescribed_diagnostics_flow, vision_wearable, maternity_care, gym_subscription, fitness_products, wellbeing_marketplace, pcos_program, parenting_program, midlife_health_program, general_health_program, fertility_care, cholesterol_program, financial_wellbeing]

    # ---------- providers & slots
    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: {$ref: '#/components/schemas/Provider'}
        total_results: {type: integer, description: "In-clinic consultations only."}
        page: {type: integer, description: "In-clinic consultations only."}
        min_price: {type: [number, 'null'], description: "Specialist consultations only."}
        fasting_required: {type: [boolean, 'null']}
        fasting_alert: {type: [string, 'null']}
        payment_type: {type: [string, 'null']}
        additional_info: {type: [object, 'null']}
        home_collection_available: {type: [boolean, 'null']}
        home_collection_provider: {type: [object, 'null']}
        auto_allocate_provider: {type: [boolean, 'null']}
    Provider:
      type: object
      description: A provider. Doctor fields are present for consultation packages. More keys may be present.
      additionalProperties: true
      properties:
        provider_id: {type: integer, description: "Send this when booking or rescheduling."}
        provider_name: {type: [string, 'null']}
        locality: {type: [string, 'null']}
        city: {type: [string, 'null']}
        state: {type: [string, 'null']}
        pincode: {type: [string, 'null']}
        address: {type: [string, 'null']}
        latitude: {type: [number, 'null']}
        longitude: {type: [number, 'null']}
        timezone: {type: string, description: "IANA timezone, e.g. Asia/Kolkata."}
        timezone_info: {type: [string, 'null']}
        home_collection_enabled: {type: [boolean, 'null']}
        serviceable: {type: [boolean, 'null']}
        is_center_available: {type: [boolean, 'null']}
        estimated_time: {type: [string, 'null']}
        estimated_distance: {type: [string, 'null']}
        distance: {type: [number, 'null']}
        rating: {type: [number, 'null']}
        slot_lead_time:
          type: [integer, 'null']
          description: Days of notice the provider needs. Used to compute the first bookable date.
        opening_time: {type: [string, 'null']}
        closing_time: {type: [string, 'null']}
        selling_price: {type: [number, string, 'null']}
        total_mrp: {type: [number, string, 'null']}
        report_turn_around_time: {}
        disrupted_dates: {}
        provider_slots:
          type: [object, 'null']
          description: Deprecated. Use `listSlots`.
          additionalProperties: true
        doctor_id: {type: string}
        doctor_name: {type: string}
        doctor_specialities: {type: array, items: {type: string}}
        doctor_experience: {type: [integer, 'null']}
        doctor_qualification: {type: [string, 'null']}
        doctor_languages: {type: array, items: {type: string}}
        doctor_fee_details:
          type: object
          properties:
            mrp: {type: [string, number]}
            selling_price: {type: [string, number]}
        doctor_availability: {type: [string, 'null'], format: date}
        doctor_photo:
          type: [object, 'null']
          properties:
            url: {type: [string, 'null']}
        doctor_gender: {type: [string, 'null']}
        hospital_name: {type: [string, 'null']}
        hospital_location: {type: [string, 'null']}
        next_available_slot: {}
        visited_before: {type: [boolean, 'null']}
    Slot:
      type: object
      properties:
        start_time: {type: string, description: 'Local time, HH:MM:SS.'}
        end_time: {type: string}
        slot: {type: string}
        available: {type: boolean}
        display_text: {type: string}
        slot_text: {type: string}
        utc_slot_time:
          type: string
          format: date-time
          description: Send this as `appointment_date_time` when booking.
        start_time_in_timezone: {type: string, format: date-time}
        end_time_in_timezone: {type: string, format: date-time}
        remaining_capacity: {type: [integer, 'null']}
        partner_slot_id: {}
        vendor_refs: {type: object}
    SlotsResponse:
      type: object
      properties:
        booking_slots:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              slots:
                type: array
                items: {$ref: '#/components/schemas/Slot'}
        date: {type: string, format: date, description: "First day only."}
        slots:
          type: array
          deprecated: true
          description: First day only. Use `booking_slots`.
          items: {$ref: '#/components/schemas/Slot'}
        report_tat: {}
        interval: {type: [integer, 'null'], description: "Slot length in seconds."}
        unavailable_reason: {type: [string, 'null']}

    # ---------- appointments
    BookingAddress:
      type: object
      description: |
        The member's address. `pincode` may be omitted: it is then derived from `latitude` and
        `longitude` (the request fails if it cannot be derived).
      required: [address_line_one, address_line_two, city, state, country, latitude, longitude]
      properties:
        address_line_one: {type: string, pattern: '\S', maxLength: 254}
        address_line_two: {type: string, pattern: '\S', maxLength: 254}
        city: {type: string, pattern: '\S'}
        state: {type: string, pattern: '\S'}
        country: {type: string, pattern: '\S', examples: [India]}
        pincode:
          type: [string, integer]
          pattern: '^[1-9][0-9]{5}$'
          minimum: 100000
          maximum: 999999
          description: 6-digit pincode (read as a number, so it cannot start with 0).
        latitude: {type: number, minimum: 0}
        longitude: {type: number, minimum: 0}
    ConsultationAddress:
      description: The member's address, as `BookingAddress`, except that `pincode` is required.
      allOf:
        - $ref: '#/components/schemas/BookingAddress'
        - required: [pincode]
    BookingCustomer:
      type: object
      required: [name, api_customer_id, mobile_number, gender, dob, package_ids]
      properties:
        name: {type: string, pattern: '\S'}
        api_customer_id: {type: string, pattern: '^[a-zA-Z0-9]+$', description: "Your id for the member. Unique within the request."}
        mobile_number: {type: string, pattern: '^[0-9]{10}$', description: "10 digits without +91."}
        gender: {type: string, enum: [male, female, non-binary]}
        dob: {type: string, format: date, description: "At least 1 year before today."}
        package_ids:
          type: array
          items: {type: [integer, string]}
        booking_customer: {type: boolean}
        vip: {type: boolean}
        api_partner_order_id: {type: string, description: "Your order reference for this appointment."}
        service_type: {type: string, description: "Optional per-customer override of `service_name`."}
    CreateAppointmentRequest:
      type: object
      required: [provider_id, appointment_date_time, appointment_type, service_name, customers]
      properties:
        provider_id: {type: [integer, string], pattern: '^[+-]?[0-9]+$'}
        appointment_date_time: {type: string, format: date-time, description: "A slot's `utc_slot_time`."}
        appointment_type: {type: string, enum: [home_collection, inclinic]}
        service_name: {$ref: '#/components/schemas/BenefitType'}
        customers:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BookingCustomer'}
        address:
          $ref: '#/components/schemas/BookingAddress'
          description: Required for home_collection.
        plan_id: {type: string}
        customer_plan_id: {type: integer, minimum: 0}
        subscription_id: {type: string}
        api_partner_order_id: {type: string, description: "Default for customers that do not send their own."}
    CreateAppointmentResponse:
      type: object
      required: [provider_id, booking_id, customers]
      properties:
        provider_id: {type: [integer, string]}
        home_collection_enable: {type: boolean}
        booking_id: {$ref: '#/components/schemas/BookingId'}
        status: {type: string, enum: [confirmed, payment_pending]}
        payment_link: {type: string, format: uri}
        payment_link_expires_at: {type: string, format: date-time}
        customers:
          type: array
          items:
            type: object
            properties:
              customer_id: {type: integer, description: "hlthstack's internal id for the member."}
              name: {type: string}
              api_customer_id: {type: string}
              package_ids: {type: array, items: {type: [integer, string]}}
              appointment_id: {$ref: '#/components/schemas/AppointmentId'}
              customer_plan_id: {type: [integer, 'null']}
              subscription_id: {type: [string, 'null']}
    RescheduleAppointmentRequest:
      type: object
      required: [appointment_date_time]
      properties:
        appointment_date_time: {type: string, format: date-time}
        provider_id:
          type: [integer, string, 'null']
          pattern: '^(?:[+-]?[0-9]+)?$'
          description: Only to move to another provider. Blank or null keeps the current provider.
        address:
          $ref: '#/components/schemas/BookingAddress'
          description: Home collection only, with provider_id. Checked only when the booking has a home-collection appointment.
    AppointmentPaymentDetailsRequest:
      type: object
      required: [provider_id, appointment_type, service_name, customers]
      properties:
        provider_id: {type: [integer, string], pattern: '^[+-]?[0-9]+$'}
        appointment_type: {type: string, enum: [home_collection, inclinic]}
        service_name: {type: string}
        plan_id: {type: string}
        customer_plan_id: {type: integer, minimum: 0}
        subscription_id: {type: string}
        customers:
          type: array
          minItems: 1
          items:
            type: object
            required: [api_customer_id, package_ids]
            properties:
              api_customer_id: {type: string, pattern: '\S'}
              package_ids: {type: array, minItems: 1, items: {type: integer}}
              booking_customer: {type: boolean}
    AppointmentPaymentDetailsResponse:
      type: object
      properties:
        payment_details:
          type: object
          properties:
            total_amount: {type: number}
            sponsor_wallet_amount: {type: number}
            customer_wallet_amount: {type: number}
            promotional_wallet_amount: {type: number}
            razorpay_amount: {type: number, description: "Amount the member pays online."}
            currency: {type: string}
    BookingDetails:
      type: object
      required: [booking_id, appointments]
      properties:
        booking_id: {type: string}
        service_name: {type: string}
        appointments:
          type: array
          items: {$ref: '#/components/schemas/AppointmentDetails'}
    AppointmentPayment:
      type: object
      properties:
        status: {type: string}
        total_collected_amount: {type: [string, number]}
        razorpay_amount: {type: [string, number]}
        razorpay_payment_id: {type: [string, 'null']}
        razorpay_order_id: {type: [string, 'null']}
        customer_wallet_amount: {type: [string, number]}
        sponsor_wallet_amount: {type: [string, number]}
        promotional_wallet_amount: {type: [string, number]}
        cod_amount: {type: [string, number]}
        h_points_amount: {type: [string, number]}
        refunded_amount: {type: [string, number]}
        captured_at: {type: [string, 'null'], format: date-time}
        refunded_at: {type: [string, 'null'], format: date-time}
    AppointmentStatus:
      type: string
      description: |
        Appointment status. Health checkups: `new`, `confirmed`, `rejected`, `noshow`,
        `cancelled`, `rescheduled`, `completed`, `verification_required`,
        `partially_received`, `received`. Consultations: `new`, `confirmed`, `rejected`,
        `noshow`, `cancelled`, `rescheduled`, `completed`, `received`. Treat unknown values
        gracefully.
    AppointmentDetails:
      type: object
      description: |
        An appointment or consultation, as returned by `getAppointment` and sent in
        status webhooks. Conditional keys are omitted when they do not apply.
      properties:
        type: {type: string, enum: [status_update, reports_upload]}
        booking_id: {type: string}
        appointment_id: {type: string}
        customer_id: {type: string, description: "hlthstack's customer id."}
        customer_name: {type: string}
        mobile_number: {type: [string, 'null']}
        api_customer_id:
          type: [string, 'null']
          description: Null for bookings hlthstack's team made on a member's behalf.
        member_id: {type: [string, 'null'], description: "Member's employee id, when known."}
        appointment_date_time: {type: string, format: date-time}
        event_timestamp: {type: number, description: "Epoch seconds of the status change."}
        booking_source:
          type: [string, 'null']
          description: Channel the booking was made through, fixed at booking time. `hlthstack-api` for bookings made through the hlthstack API hosts.
        service_type: {type: string, description: "The benefit, e.g. `ahc`, `inclinic_consultation`."}
        plan_id: {type: [string, 'null']}
        customer_plan_id: {type: [integer, 'null'], description: "Subscription that paid; null on the base plan."}
        subscription_id: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/AppointmentStatus'}
        status_text: {type: string}
        comment: {type: [string, 'null']}
        provider_id: {type: integer}
        provider_name: {type: [string, 'null']}
        provider_branch: {type: [string, 'null']}
        provider_address: {type: [string, 'null']}
        voucher_api_url:
          type: string
          format: uri
          description: Present once the appointment is confirmed.
        phlebo_name: {type: string, description: "Present once confirmed, if a phlebotomist is assigned."}
        phlebo_number: {type: string}
        reports:
          type: array
          items: {type: string, format: uri}
          description: Present in `partially_received` and `received`.
        doctor_id: {type: string}
        doctor_name: {type: string}
        doctor_specialities: {type: array, items: {type: string}}
        doctor_gender: {type: [string, 'null']}
        doctor_qualification: {type: [string, 'null']}
        doctor_languages: {type: array, items: {type: string}}
        doctor_experience: {type: [integer, 'null']}
        summary: {$ref: '#/components/schemas/FileLink'}
        doctor_prescriptions:
          type: array
          items: {$ref: '#/components/schemas/FileLink'}
        latitude: {type: [number, string, 'null']}
        longitude: {type: [number, string, 'null']}
        hospital_name: {type: [string, 'null']}
        hospital_location: {type: [string, 'null']}
        hospital_address: {type: [string, 'null']}
        meeting_link: {type: [string, 'null'], description: "Video consultations only."}
        payment: {$ref: '#/components/schemas/AppointmentPayment'}
    LabResultsPayload:
      type: object
      properties:
        type: {type: string, const: lab_results}
        booking_id: {type: string}
        appointment_id: {type: string}
        customer_id: {type: string}
        api_customer_id: {type: [string, 'null']}
        member_id: {type: [string, 'null']}
        plan_id: {type: [string, 'null']}
        digitization:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  result: {type: [string, 'null']}
                  units: {type: [string, 'null']}
                  ranges: {type: [string, 'null']}
                  test_component_id: {type: integer}
                  test_component_name: {type: string}
                  lab_test_id: {type: integer}
                  lab_test_name: {type: string}
            notes:
              type: array
              items:
                type: object
                properties:
                  title: {type: string}
                  description: {type: string}
      example:
        type: lab_results
        booking_id: EKI0000000001700000000
        appointment_id: APT1A2B3C4D5
        customer_id: EKI000000001
        api_customer_id: CUST1001
        member_id: null
        plan_id: EXAMPLE_PLAN
        digitization:
          results:
            - {result: '80', units: mg/dL, ranges: '<70,70-140,>140', test_component_id: 1, test_component_name: Fasting Blood Sugar, lab_test_id: 1, lab_test_name: Blood Glucose}

    # ---------- consultations
    ConsultationCustomer:
      type: object
      required: [name, api_customer_id, mobile_number, gender, dob, package_ids]
      properties:
        name: {type: string, pattern: '\S'}
        api_customer_id: {type: string, pattern: '^[a-zA-Z0-9]+$', description: "Your id for the member. Unique within the request."}
        mobile_number: {type: string, pattern: '^[0-9]{10}$', description: "10 digits without +91."}
        gender: {type: string, enum: [male, female, non-binary]}
        dob: {type: string, format: date, description: "At least 1 year before today."}
        package_ids: {type: array, items: {type: [integer, string]}}
    CreateInclinicConsultationRequest:
      type: object
      required: [provider_id, appointment_date_time, customers, address]
      properties:
        appointment_date_time: {type: string, format: date-time, description: "Later than now."}
        service_mode: {type: string, enum: [at_provider_location]}
        provider_id: {type: [integer, string], pattern: '^[+-]?[0-9]+$'}
        customers:
          type: array
