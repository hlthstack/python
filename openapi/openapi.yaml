          items: {$ref: '#/components/schemas/ConsultationCustomer'}
        address: {$ref: '#/components/schemas/ConsultationAddress'}
        plan_id: {type: string}
        customer_plan_id: {type: integer, minimum: 0}
        subscription_id: {type: string}
    CreateSpecialistConsultationRequest:
      type: object
      required: [provider_id, customers]
      properties:
        appointment_date_time:
          type: string
          format: date-time
          description: Required, and later than now, unless `priority_consultation` is true.
        service_mode: {type: string, enum: [audio_call, video_call]}
        priority_consultation: {type: boolean, default: false}
        provider_id: {type: [integer, string], pattern: '^[+-]?[0-9]+$'}
        customers:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ConsultationCustomer'}
        plan_id: {type: string}
        customer_plan_id: {type: integer, minimum: 0}
