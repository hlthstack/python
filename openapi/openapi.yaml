openapi: 3.1.0
info:
  title: hlthstack API
  version: 1.0.0
  summary: Partner REST API for health checkups, lab tests, doctor consultations, ePharmacy, benefit wallets and member pre-registration.
  description: |
    The hlthstack API lets partners book and manage health benefits for their members:
    health checkups and lab tests, in-clinic and online specialist consultations, ePharmacy
    orders, and benefit wallet balances. Status changes are pushed to you through webhooks
    (see the `webhooks` section).

    **Authentication.** Call `getAccessToken` with HTTP Basic credentials issued by hlthstack.
    It returns a bearer token valid for 1 hour. Send it as `Authorization: Bearer <token>` on
    every other call. Multi-entity partners also send `API-ENTITY-ID` and `API-SECRET-KEY`.

    **Pre-registration** (tag `Pre-registration`) uses its own credentials and token: call
    `getPreRegistrationAccessToken` with HTTP Basic and send the token as `X-EKINCARE-KEY`.

    **Conventions.**
    - Request and response bodies are JSON unless stated otherwise (vouchers are PDF, some
      uploads are multipart).
    - Date-times are ISO 8601. Send `appointment_date_time` in UTC (`2030-01-15T03:30:00Z`).
    - `plan_id`, wherever accepted, is the plan identifier hlthstack shares at onboarding
      (a string). It is optional; when omitted, the entity's base plan is used.
    - Any unhandled error is returned as `422 {"errors":{"messages":["..."]}}`.

    **Input validation.** Request schemas encode the checks the server applies to the input
    itself (`required`, `enum`, `pattern`, `minLength`, `maximum`, `minItems`, ...). Patterns
    are ECMAScript/Python regexes and are matched as a search, as JSON Schema specifies:
    a pattern is anchored (`^...$`) only where the server anchors it. Rules that span fields
    or need the current date are listed on the operation under `x-hlthstack-rules`, each
    `{rule, description, fields}`, where `rule` is one of the kinds in
    `x-hlthstack-rule-kinds` and `fields` are dotted paths (`customers[].dob`). Checks that
    depend on stored data (plan benefits, slot availability, provider capability) are not
    encoded and are reported by the server.

    Guides: https://github.com/hlthstack/integration-guide/tree/main/docs
  contact:
    name: hlthstack
    url: https://www.hlthstack.io/
servers:
  - url: https://api.hlthstack.io
    description: Production
  - url: https://staging-api.hlthstack.io
    description: Staging (sandbox for integration testing; staging-only endpoints are available here)
security:
  - bearerAuth: []
x-hlthstack-rule-kinds:
  required_if: The listed fields are required when the condition in the description holds.
  at_least_one_of: At least one of the listed fields must be present and non-blank.
  mutually_exclusive: At most one of the listed fields may be sent.
  allowed_only_if: The listed fields may be sent only when the condition in the description holds.
  unique_by: No two array items may share the listed field's value (compared as strings).
  relative_date: The date or date-time must fall on the side of today or now given in the description.
  no_conflicting_pincode: For an Indian address (blank country counts as India), the listed text fields must not contain a standalone 6-digit number other than the address pincode.
  file_limits: Each uploaded file must meet the size and type limits in the description.
  item_count: The number of items, across the listed arrays, must be within the bounds in the description.
  positive_decimal: The value must parse as a decimal number greater than 0.
tags:
  - name: Authentication
    description: Obtain a bearer access token.
  - name: Health Checkups
    description: Providers, slots and appointments for health checkups, lab tests, dental, vision and vaccinations.
  - name: Consultations
    description: In-clinic consultations and online specialist consultations (scheduled and priority).
  - name: ePharmacy
    description: Medicine search, prescription digitization, cart, pricing and orders.
  - name: Wallet
    description: Member benefit wallets and plan subscriptions.
  - name: Pre-registration
    description: Register, update and deactivate members and their dependants in bulk. Uses its own credentials and token (`X-EKINCARE-KEY`).
  - name: Testing
    description: Staging-only endpoints that move a booking or order through its lifecycle and fire the real webhooks.

paths:
  # ---------------------------------------------------------------- Authentication
  /api/get-access-token:
    get:
      operationId: getAccessToken
      tags: [Authentication]
      summary: Get an access token
      description: |
        Exchanges the username and password issued by hlthstack (HTTP Basic) for a bearer
        token. The token expires 1 hour after issue (`expires_at`). Request a new one before
        it expires; there is no refresh token.
      security:
        - basicAuth: []
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              example:
                access_token: YOUR_ACCESS_TOKEN
                expires_at: '2026-01-15T07:16:21Z'
        '401':
          description: Wrong username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
              example:
                message: Wrong credentials

  # ---------------------------------------------------------------- Health checkups
  /api/providers:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    get:
      operationId: listProviders
      tags: [Health Checkups]
      summary: List providers
      description: |
        Lists providers (diagnostic centres, clinics, doctors) near a location that can
        serve the given packages, ordered by distance. Use `listSlots` for availability:
        the `provider_slots` embedded here is deprecated.

        Either `pincode` or both `latitude` and `longitude` are required (if only coordinates
        are sent the pincode is derived from them). `sort_by` and `gender` are supported only
        for `service_name=inclinic_consultation`.
      x-hlthstack-rules:
        - rule: required_if
          description: When pincode is not sent, latitude and longitude are both required (the pincode is derived from them).
          fields: [pincode, latitude, longitude]
        - rule: allowed_only_if
          description: sort_by and gender are accepted only when service_name is inclinic_consultation.
          fields: [sort_by, gender, service_name]
        - rule: required_if
          description: api_customer_id is required when sort_by is visited_before.
          fields: [api_customer_id, sort_by]
      parameters:
        - $ref: '#/components/parameters/ServiceName'
        - $ref: '#/components/parameters/PackageIdsQuery'
        - $ref: '#/components/parameters/PincodeQuery'
        - $ref: '#/components/parameters/LatitudeQuery'
        - $ref: '#/components/parameters/LongitudeQuery'
        - name: radius
          in: query
          description: Search radius in km for in-clinic providers. Default 100.
          schema: {type: number, default: 100}
        - name: auto_allocate_provider
          in: query
          description: |
            Home-collection packages only. Let hlthstack allocate the best provider by
            availability. The appointment is cancelled if no provider is available at the
            location, and the slot may change if no provider is free at that time.
          schema: {type: boolean}
        - $ref: '#/components/parameters/PlanIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortAsc'
        - $ref: '#/components/parameters/DoctorGender'
        - $ref: '#/components/parameters/VisitedBeforeCustomer'
      responses:
        '200':
          description: Providers found (the list may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
              example:
                providers:
                  - provider_id: 1001
                    provider_name: Example Diagnostics
                    locality: Madhapur
                    city: Hyderabad
                    state: Telangana
                    pincode: '500081'
                    timezone: Asia/Kolkata
                    timezone_info: Indian Standard Time (IST) (GMT+5:30)
                    home_collection_enabled: true
                    latitude: 17.44
                    longitude: 78.38
                    address: 1 Example Road, Madhapur, Hyderabad, Telangana 500081
                    serviceable: true
                    is_center_available: true
                    estimated_time: 15-20 mins
                    estimated_distance: 2.2 kms
                    rating: 4.5
                    slot_lead_time: 1
                    provider_slots: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ServiceNotEnabled'
        '404':
          description: '`sort_by=visited_before` with an unknown `api_customer_id`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldErrors'}
              example:
                errors:
                  api_customer_id: ['customer not found: CUST1001']
        '500':
          $ref: '#/components/responses/ServerError'

  /api/providers/{provider_id}/{benefit_type}/slots:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - name: provider_id
        in: path
        required: true
        schema: {type: integer}
        example: 1001
      - name: benefit_type
        in: path
        required: true
        description: The service the slots are for. Same values as `service_name`.
        schema:
          type: string
          examples: [ahc, dental, vision, flu_vaccination, covid_vaccination, inclinic_consultation, specialist_consultation]
    get:
      operationId: listSlots
      tags: [Health Checkups, Consultations]
      summary: List slots for a provider
      description: |
        Returns bookable slots for one provider and benefit. Pass `booking_date` for a single
        day; omit it for several days (`count_days`, default 14). Read `booking_slots`; the
        top-level `date` and `slots` describe only the first day and are deprecated.

        The first bookable date depends on the provider's `slot_lead_time` and timezone
        (from `listProviders`); a `booking_date` before it returns 400.

        For `inclinic_consultation` and `specialist_consultation` the provider must be an
        active doctor whose speciality matches the packages.
      parameters:
        - name: package_ids
          in: query
          required: true
          description: Comma-separated package ids.
          schema: {type: string}
          example: '1001'
        - name: booking_date
          in: query
          description: Day to fetch (YYYY-MM-DD). Omit for multiple days.
          schema: {type: string, format: date}
        - name: count_days
          in: query
          description: Number of days to return when `booking_date` is omitted. Default 14.
          schema: {type: integer}
        - name: slot_start_date
          in: query
          description: Start the multi-day window no earlier than this date.
          schema: {type: string, format: date}
        - name: pincode
          in: query
          description: 6-digit pincode of the member's location. Derived from `latitude`/`longitude` when omitted.
          schema: {type: string}
          example: '500081'
        - $ref: '#/components/parameters/LatitudeQuery'
        - $ref: '#/components/parameters/LongitudeQuery'
        - name: city_name
          in: query
          description: City for the pincode. Derived from the pincode when omitted.
          schema: {type: string}
        - $ref: '#/components/parameters/PlanIdQuery'
      responses:
        '200':
          description: Slots.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotsResponse'}
              example:
                date: '2026-01-15'
                booking_slots:
                  - date: '2026-01-15'
                    slots:
                      - start_time: '08:00:00'
                        end_time: '09:00:00'
                        slot: 08 - 09 AM
                        available: true
                        display_text: '08:00 AM'
                        slot_text: '08:00 AM and 09:00 AM'
                        utc_slot_time: '2026-01-15T02:30:00.000Z'
                        start_time_in_timezone: '2026-01-15T08:00:00.000+05:30'
                        end_time_in_timezone: '2026-01-15T09:00:00.000+05:30'
                        remaining_capacity: 12
                report_tat: null
                interval: 3600
                unavailable_reason: null
        '400':
          description: Missing details, invalid booking date, or (consultations) invalid provider/package.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MessageError'
                  - $ref: '#/components/schemas/FieldErrors'
              examples:
                missing:
                  value: {message: Required details are missing}
                tooEarly:
                  value: {message: "Booking date 2026-01-14 is before the provider's earliest available date 2026-01-15"}
                provider:
                  value: {errors: {package_ids: [The selected provider does not match the package specialities]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ServiceNotEnabled'
        '500':
          description: The provider's own system could not be reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageError'}
              example: {message: Failed to fetch slots from partner}

  /api/appointments:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    post:
      operationId: createAppointment
      tags: [Health Checkups]
      summary: Create a booking
      description: |
        Books one appointment per customer at one provider and time. All appointments share
        a `booking_id`; each customer gets an `appointment_id`.

        The booking customer is the last entry with `booking_customer: true`, else the first.
        `address` is required for `home_collection`.

        If the member's wallet covers the cost the booking is placed and `status` is
        `confirmed` (the appointment itself still starts at `new` and is confirmed by the
        provider). If an amount is due, `status` is `payment_pending` and `payment_link` must
        be paid by the member.

        To pay from a specific subscription when a customer holds several on a plan, send
        `customer_plan_id` (hlthstack's id, from `listCustomerPlans`) or `subscription_id`
        (your own id). `customer_plan_id` wins when both are sent.
      x-hlthstack-rules:
        - rule: required_if
          description: address is required when appointment_type is home_collection.
          fields: [address, appointment_type]
        - rule: unique_by
          description: Each customer needs its own api_customer_id.
          fields: ['customers[].api_customer_id']
        - rule: relative_date
          description: Each customer's dob must be on or before the same date one year ago (members must be at least 1 year old).
          fields: ['customers[].dob']
        - rule: no_conflicting_pincode
          description: Home collection only. address_line_one, address_line_two, city, state and country must not contain a 6-digit pincode other than address.pincode.
          fields: [address.address_line_one, address.address_line_two, address.city, address.state, address.country, address.pincode]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAppointmentRequest'}
            example:
              appointment_date_time: '2030-01-15T02:30:00Z'
              appointment_type: home_collection
              service_name: ahc
              provider_id: 1001
              customers:
                - name: Jane Doe
                  dob: '1990-08-24'
                  mobile_number: '9999999999'
                  api_customer_id: CUST1001
                  booking_customer: true
                  gender: female
                  package_ids: [1001]
                  api_partner_order_id: ORDER-1001
              address:
                address_line_one: 1 Example Road
                address_line_two: Madhapur
                city: Hyderabad
                state: Telangana
                country: India
                pincode: '500081'
                latitude: 17.4437
                longitude: 78.3860
      responses:
        '200':
          description: Booking created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateAppointmentResponse'}
              example:
                provider_id: 1001
                home_collection_enable: true
                booking_id: EKI0000000001700000000
                status: confirmed
                customers:
                  - customer_id: 5001
                    name: Jane Doe
                    api_customer_id: CUST1001
                    package_ids: [1001]
                    appointment_id: APT1A2B3C4D5
                    customer_plan_id: null
                    subscription_id: null
        '400':
          description: Validation error, invalid subscription, or booking failure.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FieldErrors'
                  - $ref: '#/components/schemas/BookingFailure'
              examples:
                validation:
                  value:
                    errors:
                      appointment_type: [invalid appointment_type]
                      appointment_date_time: [invalid appointment date/time format]
                      customer_mobile_number: [is the wrong length (should be 10 characters)]
                subscription:
                  value: {errors: {customer_plan_id: [is not active]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Booking error, or a duplicate booking for the same package, provider and slot.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorMessages'
                  - $ref: '#/components/schemas/BookingFailure'
              example:
                errors:
                  messages: [customer has an ongoing appointment for same package and provider for same slot]
    get:
      operationId: getAppointment
      tags: [Health Checkups]
      summary: Get booking or appointment details
      description: |
        Pass only `booking_id` to get every appointment in the booking; add `appointment_id`
        to get one appointment. Each appointment has the same shape as the appointment
        webhook payload.
      parameters:
        - name: booking_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/BookingId'}
        - name: appointment_id
          in: query
          schema: {$ref: '#/components/schemas/AppointmentId'}
      responses:
        '200':
          description: Booking details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingDetails'}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourBooking'

  /api/appointments/customer_appointments:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    get:
      operationId: listCustomerAppointments
      tags: [Health Checkups]
      summary: List a customer's appointments
      description: |
        Returns up to 50 of a customer's most recent appointments (newest first), each in
        the appointment webhook shape. Identify the customer by `api_customer_id` or
        `employee_id` (`api_customer_id` wins when both are sent).
      x-hlthstack-rules:
        - rule: at_least_one_of
          description: Send api_customer_id or employee_id.
          fields: [api_customer_id, employee_id]
      parameters:
        - name: api_customer_id
          in: query
          schema: {type: string}
        - name: employee_id
          in: query
          schema: {type: string}
        - name: from_date
          in: query
          description: Only appointments on or after this date.
          schema: {type: string, format: date}
        - name: to_date
          in: query
          description: Only appointments on or before this date.
          schema: {type: string, format: date}
        - name: status
          in: query
          description: Only appointments in this status (for example `confirmed`).
          schema: {type: string}
      responses:
        '200':
          description: Appointments.
          content:
            application/json:
              schema:
                type: object
                required: [appointments]
                properties:
                  appointments:
                    type: array
                    items: {$ref: '#/components/schemas/AppointmentDetails'}
        '400':
          description: Neither id was sent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [api_customer_id or employee_id is required]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown customer, or no appointments match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [No appointments found for the given customer]}}

  /api/appointments/payment_details:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    post:
      operationId: getAppointmentPaymentDetails
      tags: [Health Checkups]
      summary: Quote a booking
      description: |
        Prices a prospective booking without creating it and shows how it would be split
        between wallets and an amount the member pays. Customers must already exist (have
        been booked or registered before).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentPaymentDetailsRequest'}
            example:
              provider_id: 1001
              appointment_type: inclinic
              service_name: ahc
              customers:
                - api_customer_id: CUST1001
                  package_ids: [1001]
                  booking_customer: true
      responses:
        '200':
          description: Quote.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentPaymentDetailsResponse'}
              example:
                payment_details:
                  total_amount: 1500.0
                  sponsor_wallet_amount: 1500.0
                  customer_wallet_amount: 0.0
                  promotional_wallet_amount: 0.0
                  razorpay_amount: 0.0
                  currency: INR
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: A customer was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldErrors'}
              example: {errors: {api_customer_id: ['customer not found: CUST1001']}}
        '422':
          $ref: '#/components/responses/UnprocessableMessages'

  /api/bookings/{booking_id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/BookingIdPath'
    patch:
      operationId: rescheduleBooking
      tags: [Health Checkups]
      summary: Reschedule every appointment in a booking
      description: |
        Moves all appointments in the booking. See `rescheduleAppointment` for the rules.
        Some appointments may be moved while others are not; the response then lists both as
        comma-separated `appointment_id`s.
      x-hlthstack-rules:
        - rule: no_conflicting_pincode
          description: When address is sent for a home-collection booking, address_line_one, address_line_two, city, state and country must not contain a 6-digit pincode other than address.pincode.
          fields: [address.address_line_one, address.address_line_two, address.city, address.state, address.country, address.pincode]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RescheduleAppointmentRequest'}
            example:
              appointment_date_time: '2030-01-16T02:30:00Z'
      responses:
        '200':
          description: All or some appointments rescheduled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartialResult'}
              examples:
                full:
                  value: {message: Booking rescheduled successfully}
                partial:
                  value:
                    message: Some appointments cannot be rescheduled
                    success: APT1A2B3C4D5,APT1A2B3C4D6
                    failed: APT1A2B3C4D7
        '400':
          description: Validation error, or no appointment in the booking can be rescheduled.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FieldErrors'
                  - $ref: '#/components/schemas/ErrorMessages'
              example: {errors: {messages: [This booking cannot be rescheduled]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourBooking'
        '422':
          $ref: '#/components/responses/DifferentProvider'

  /api/bookings/{booking_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/BookingIdPath'
    patch:
      operationId: cancelBooking
      tags: [Health Checkups]
      summary: Cancel every appointment in a booking
      description: |
        Home collection: allowed until a phlebotomist is assigned or 30 minutes before the
        slot, whichever is first. In-clinic: allowed until 30 minutes before the slot.
      responses:
        '200':
          description: All or some appointments cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartialResult'}
              examples:
                full:
                  value: {message: Booking cancelled successfully}
                partial:
                  value:
                    message: Some appointments cannot be cancelled
                    success: APT1A2B3C4D5
                    failed: APT1A2B3C4D6
        '400':
          description: No appointment in the booking can be cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [This booking cannot be cancelled]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourBooking'

  /api/appointments/{appointment_id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    patch:
      operationId: rescheduleAppointment
      tags: [Health Checkups]
      summary: Reschedule an appointment
      description: |
        - New time only: send `appointment_date_time`.
        - New provider: add `provider_id`. Not allowed once the appointment is confirmed at
          the current provider.
        - New address (home collection): add `address` together with `provider_id`.

        Home collection: allowed until a phlebotomist is assigned or 30 minutes before the
        slot, whichever is first. In-clinic: until 30 minutes before the slot. An in-clinic
        appointment cannot become home collection.
      x-hlthstack-rules:
        - rule: no_conflicting_pincode
          description: When address is sent for a home-collection appointment, address_line_one, address_line_two, city, state and country must not contain a 6-digit pincode other than address.pincode.
          fields: [address.address_line_one, address.address_line_two, address.city, address.state, address.country, address.pincode]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RescheduleAppointmentRequest'}
            example:
              appointment_date_time: '2030-01-16T02:30:00Z'
              provider_id: 1002
      responses:
        '200':
          description: Rescheduled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: Appointment rescheduled successfully}
        '400':
          description: Validation error, or the appointment cannot be rescheduled.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FieldErrors'
                  - $ref: '#/components/schemas/ErrorMessages'
              example: {errors: {messages: [This appointment cannot be rescheduled]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'
        '422':
          description: |
            Different provider after confirmation, a request already in progress, or a
            duplicate appointment at the new slot.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FieldErrors'
                  - $ref: '#/components/schemas/ErrorMessages'
              examples:
                provider:
                  value: {errors: {provider_id: [Appointment cannot be rescheduled to a different provider.]}}
                inProgress:
                  value: {errors: {messages: ['Previous request is in progress, please try rescheduling after few minutes']}}

  /api/appointments/{appointment_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    patch:
      operationId: cancelAppointment
      tags: [Health Checkups]
      summary: Cancel an appointment
      description: Same cut-offs as `cancelBooking`.
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: Appointment cancelled successfully}
        '400':
          description: The appointment cannot be cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [This appointment cannot be cancelled]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'
        '422':
          $ref: '#/components/responses/UnprocessableMessages'

  /api/appointments/{appointment_id}/voucher:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    get:
      operationId: getAppointmentVoucher
      tags: [Health Checkups]
      summary: Download the appointment voucher
      description: Returns the voucher PDF. Available only once the appointment is `confirmed`.
      responses:
        '200':
          description: Voucher PDF.
          content:
            application/pdf:
              schema: {type: string, contentMediaType: application/pdf}
        '400':
          description: Not confirmed yet, or this appointment type has no voucher.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [voucher only available for download when appointment is confirmed]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'

  /api/appointments/{appointment_id}/reports:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    get:
      operationId: getAppointmentReports
      tags: [Health Checkups]
      summary: Get verified report links
      description: |
        Call when the appointment is `partially_received` or `received`. Returns links to
        the verified reports, or a message if none are verified yet.
      responses:
        '200':
          description: Report links, or not yet verified.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [reports]
                    properties:
                      reports:
                        type: array
                        items: {type: string, format: uri}
                  - $ref: '#/components/schemas/Message'
              examples:
                verified:
                  value: {reports: ['https://files.example.com/reports/APT1A2B3C4D5.pdf']}
                pending:
                  value: {message: Reports will be available to download once they are verified}
        '400':
          description: Reports are not available in the current status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [Reports unavailable]}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'

  /api/appointments/{appointment_id}/lab_results:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    get:
      operationId: getAppointmentLabResults
      tags: [Health Checkups]
      summary: Get digitized lab results
      description: |
        Returns the structured lab values for an appointment (same body as the
        `labResults` webhook). Enabled on request: ask hlthstack to register a lab-results
        webhook endpoint for you; without one this returns 401.
      responses:
        '200':
          description: Lab results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabResultsPayload'}
        '400':
          description: Not yet verified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [Digitized lab results will be available once they are verified]}}
        '401':
          description: Lab results are not enabled for you (or the token is invalid).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorMessages'}
              example: {errors: {messages: [Unauthorised]}}
        '403':
          $ref: '#/components/responses/NotYourAppointment'

  /api/appointments/{appointment_id}/update_status:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    post:
      operationId: simulateAppointmentStatus
      tags: [Testing]
      summary: (Staging only) Move an appointment to a new status
      description: |
        **Staging only.** Production returns 401. Moves the appointment through its
        lifecycle and fires the same webhook a real update would.
      servers:
        - url: https://staging-api.hlthstack.io
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirm, assign_phlebo, cancel, completed, reschedule, reports_partially_received, reports_received, lab_result]
                  description: |
                    `reschedule` moves the appointment to the next day. `assign_phlebo` needs a
                    confirmed appointment. `lab_result` needs a `received` appointment and a
                    lab-results webhook endpoint.
            example: {status: confirm}
      responses:
        '200':
          description: Status changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Messages'}
              example: {messages: [Appointment status updated successfully]}
        '401':
          description: Called outside staging (or invalid token).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorList'}
              example: {errors: ['Unauthorised, This API is intended for use only in non-production environments']}
        '422':
          description: Invalid status or precondition not met.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorList'}
              example: {errors: [Appointment is not confirmed yet]}
        '500':
          description: Transition not allowed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorList'}
              example: {errors: [Appointment status cannot be changed from confirmed to confirm]}

  # ---------------------------------------------------------------- Consultations
  /api/consultations/inclinic_consultation/providers:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    get:
      operationId: listInclinicConsultationProviders
      tags: [Consultations]
      summary: List in-clinic doctors
      description: Doctors near a location for the given consultation packages, with doctor details.
      x-hlthstack-rules:
        - rule: required_if
          description: When pincode is not sent, latitude and longitude are both required (the pincode is derived from them).
          fields: [pincode, latitude, longitude]
        - rule: required_if
          description: api_customer_id is required when sort_by is visited_before.
          fields: [api_customer_id, sort_by]
      parameters:
        - $ref: '#/components/parameters/PackageIdsQuery'
        - $ref: '#/components/parameters/PincodeQuery'
        - $ref: '#/components/parameters/LatitudeQuery'
        - $ref: '#/components/parameters/LongitudeQuery'
        - name: radius
          in: query
          description: Search radius in km. Default 100.
          schema: {type: number, default: 100}
        - $ref: '#/components/parameters/PlanIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortAsc'
        - $ref: '#/components/parameters/DoctorGender'
        - $ref: '#/components/parameters/VisitedBeforeCustomer'
      responses:
        '200':
          description: Providers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvidersResponse'}
              example:
                providers:
                  - provider_id: 2001
                    locality: Madhapur
                    city: Hyderabad
                    pincode: '500081'
                    estimated_distance: 2.2 kms
                    doctor_id: DOC000000001
                    doctor_name: Dr. Jane Doe
                    doctor_specialities: [General Medicine]
                    doctor_experience: 8
                    doctor_qualification: MBBS
                    doctor_languages: [English, Hindi]
                    doctor_fee_details: {mrp: '1000', selling_price: '800'}
                    doctor_availability: '2026-01-15'
                    doctor_gender: Female
                    hospital_name: Example Clinic
                    hospital_location: Madhapur
                total_results: 1
                page: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ServiceNotEnabled'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/consultations/specialist_consultation/providers:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    get:
      operationId: listSpecialistConsultationProviders
      tags: [Consultations]
      summary: List online specialists
      description: |
        Doctors available for online (audio/video) specialist consultations. No location is
        needed. Send `default_provider=true` to list the providers configured for **priority**
        consultations; an empty list means priority consultation is unavailable for the
        package or right now.
      parameters:
        - $ref: '#/components/parameters/PackageIdsQuery'
        - name: default_provider
          in: query
          description: '`true` to list priority-consultation providers.'
          schema: {type: boolean}
        - $ref: '#/components/parameters/PlanIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Providers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvidersResponse'}
              example:
                providers:
                  - provider_id: 3001
                    timezone: Asia/Kolkata
                    rating: 5
                    doctor_name: Dr. Jane Doe
                    doctor_specialities: [Neurology]
                    doctor_experience: 10
                    doctor_qualification: MBBS, MD
                    doctor_languages: [English]
                    doctor_fee_details: {mrp: '900', selling_price: '700'}
                    doctor_availability: '2026-01-15'
                    doctor_photo: {url: 'https://files.example.com/doctor.jpg'}
                    doctor_gender: Female
                min_price: 700
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ServiceNotEnabled'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/consultations/inclinic_consultation:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    post:
      operationId: createInclinicConsultation
      tags: [Consultations]
      summary: Book an in-clinic consultation
      description: |
        Books an in-person consultation at the doctor's clinic. `service_mode`, when sent,
        must be `at_provider_location`; `address` (the member's) is required, including
        `pincode`. The booking is made for the first customer in `customers`. Subscription
        selection works as in `createAppointment`.
      x-hlthstack-rules:
        - rule: unique_by
          description: Each customer needs its own api_customer_id.
          fields: ['customers[].api_customer_id']
        - rule: relative_date
          description: Each customer's dob must be on or before the same date one year ago (members must be at least 1 year old).
          fields: ['customers[].dob']
        - rule: relative_date
          description: appointment_date_time must be later than now (a time without an offset is read as IST).
          fields: [appointment_date_time]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInclinicConsultationRequest'}
            example:
              appointment_date_time: '2030-01-15T04:30:00.000Z'
              service_mode: at_provider_location
              provider_id: 2001
              customers:
                - name: Jane Doe
                  dob: '1990-08-24'
                  mobile_number: '9999999999'
                  api_customer_id: CUST1001
                  gender: female
                  package_ids: [2001]
              address:
                address_line_one: 1 Example Road
                address_line_two: Kondapur
                city: Hyderabad
                state: Telangana
                country: India
                pincode: '500084'
                latitude: 17.47
                longitude: 78.35
      responses:
        '200':
          $ref: '#/components/responses/ConsultationCreated'
        '400':
          $ref: '#/components/responses/ConsultationBookingError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ConsultationBookingConflict'

  /api/consultations/specialist_consultation:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
    post:
      operationId: createSpecialistConsultation
      tags: [Consultations]
      summary: Book an online specialist consultation
      description: |
        Books an audio or video consultation.

        - **Scheduled** (`priority_consultation: false`): `appointment_date_time` must be a
          slot from `listSlots`; `provider_id` must not be a priority provider.
        - **Priority** (`priority_consultation: true`): a doctor calls within about 4 hours.
          Available 8 AM-4 PM IST; `provider_id` must come from
          `listSpecialistConsultationProviders` with `default_provider=true`;
          `appointment_date_time` is optional. The consultation is `confirmed` immediately and
          the doctor's details arrive by webhook once a doctor is assigned.
      x-hlthstack-rules:
        - rule: required_if
          description: appointment_date_time is required unless priority_consultation is true.
          fields: [appointment_date_time, priority_consultation]
        - rule: relative_date
          description: Unless priority_consultation is true, appointment_date_time must be later than now (a time without an offset is read as IST).
          fields: [appointment_date_time, priority_consultation]
        - rule: unique_by
          description: Each customer needs its own api_customer_id.
          fields: ['customers[].api_customer_id']
        - rule: relative_date
          description: Each customer's dob must be on or before the same date one year ago (members must be at least 1 year old).
          fields: ['customers[].dob']
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSpecialistConsultationRequest'}
            example:
              appointment_date_time: '2030-01-15T04:30:00.000Z'
              service_mode: audio_call
              provider_id: 3001
              priority_consultation: false
              customers:
                - name: Jane Doe
                  dob: '1990-08-24'
                  mobile_number: '9999999999'
                  api_customer_id: CUST1001
                  gender: female
                  package_ids: [3001]
      responses:
        '200':
          $ref: '#/components/responses/ConsultationCreated'
        '400':
          $ref: '#/components/responses/ConsultationBookingError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ConsultationBookingConflict'

  /api/consultations/inclinic_consultation/{appointment_id}:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    get:
      operationId: getInclinicConsultation
      tags: [Consultations]
      summary: Get an in-clinic consultation
      responses:
        '200':
          description: Consultation details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsultationDetails'}
              example:
