                appointment_id: APT1A2B3C4D5
                appointment_date_time: '2030-01-15T04:30:00Z'
                status: confirmed
                service_name: Inclinic consultation
                service_mode: at_provider_location
                api_customer_id: CUST1001
                customer_id: EKI000000001
                doctor_id: DOC000000001
                doctor_name: Dr. Jane Doe
                doctor_specialities: [General Medicine]
                doctor_gender: Female
                doctor_qualification: MBBS
                doctor_languages: [English, Hindi]
                doctor_experience: 8
                provider_id: 2001
                is_priority_consultation: false
                is_default_provider: false
                latitude: 17.44
                longitude: 78.38
                hospital_name: Example Clinic
                hospital_location: Madhapur
                hospital_address: 1 Example Road, Madhapur, Hyderabad, Telangana 500081
        '400':
          $ref: '#/components/responses/InvalidAppointmentId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotYourAppointment'

  /api/consultations/specialist_consultation/{appointment_id}:
    parameters:
      - $ref: '#/components/parameters/ApiEntityId'
      - $ref: '#/components/parameters/ApiSecretKey'
      - $ref: '#/components/parameters/AppointmentIdPath'
    get:
      operationId: getSpecialistConsultation
      tags: [Consultations]
      summary: Get an online specialist consultation
      responses:
        '200':
          description: Consultation details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsultationDetails'}
              example:
                booking_id: EKI0000000001700000000
                appointment_id: APT1A2B3C4D5
                appointment_date_time: '2030-01-15T04:30:00Z'
                status: confirmed
                service_name: Specialist consultation
                service_mode: video_call
                api_customer_id: CUST1001
                customer_id: EKI000000001
                doctor_id: DOC000000002
                doctor_name: Dr. Jane Doe
                doctor_specialities: [Neurology]
                doctor_gender: Female
                doctor_qualification: MBBS, MD
                doctor_languages: [English]
                doctor_experience: 10
