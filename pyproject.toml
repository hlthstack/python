[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hlthstack"
dynamic = ["version"]
description = "Official Python client for the hlthstack partner REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hlthstack" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.23,<1"]
keywords = ["hlthstack", "health", "benefits", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.hlthstack.io/"
Documentation = "https://github.com/hlthstack/integration-guide"
Source = "https://github.com/hlthstack/python"
Issues = "https://github.com/hlthstack/python/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "pyyaml>=6",
  "types-pyyaml>=6",
  # Plain-API examples (examples/api) and their tests; not runtime dependencies.
  "requests>=2.28",
  "types-requests>=2.28",
  "flask>=2.2",
]

[tool.hatch.version]
path = "src/hlthstack/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hlthstack"]

[tool.hatch.build.targets.sdist]
include = ["src/hlthstack", "tests", "scripts", "openapi", "docs", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated: long strings copied from the OpenAPI spec.
"src/hlthstack/_validation_spec.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src/hlthstack", "tests", "scripts", "examples/api"]
